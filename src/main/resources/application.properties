# ==========================================
# RadBrain Application Properties
# Clean Version - No Encoding Issues
# ==========================================

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
server.servlet.context-path=/


#
# VORHER:
spring.jpa.hibernate.ddl-auto=update

#
# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/radbrain?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Vienna
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt.secret=JpMQ/BA8Bbj0XacBnbyP/D7SvwVzrT9q/eIwbzyRvhQ
jwt.expiration-ms=86400000

# ==========================================
# EMAIL CONFIGURATION
# ==========================================
app.mail.enabled=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=radbrain.dynamik@gmail.com
spring.mail.password=lwziilovdxnxeizl
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# Content Type
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.favor-path-extension=false

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false


# Debug Logging für Security
logging.level.org.springframework.security.web=TRACE

# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
app.name=RadBrain
app.base-url=http://localhost:8080


# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.root=INFO
logging.level.org.nikolic.programm=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

logging.file.name=logs/radbrain.log
logging.file.max-size=10MB
logging.file.max-history=30

# ==========================================
# CACHE CONFIGURATION
# ==========================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

# ==========================================
# SCHEDULING
# ==========================================
spring.task.scheduling.pool.size=2

# ==========================================
# VALIDATION
# ==========================================
spring.jackson.deserialization.fail-on-unknown-properties=false

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ==========================================
# DEVELOPMENT MODE
# ==========================================
spring.profiles.active=dev
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# SECURITY
# ==========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Fix HTML Content-Type
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**
