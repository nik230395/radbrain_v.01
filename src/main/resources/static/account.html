<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Account - RadBrain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
  <div class="navbar-content">
    <div class="nav-left">
      <img src="logo.png" alt="RadBrain" class="nav-logo">
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="/user-home.html" class="nav-link">Übersicht</a>
        </li>
        <li class="nav-item dropdown">
          <a href="#" class="nav-link">Lernbereiche</a>
          <ul class="dropdown-menu" id="learningAreasMenu"></ul>
        </li>
        <li class="nav-item">
          <a href="/quizzes.html" class="nav-link">Quizzes</a>
        </li>
      </ul>
    </div>
    <div class="nav-right" id="navRight"></div>
  </div>
</nav>

<!-- Main Content -->
<div class="container" style="padding-top: var(--space-12); padding-bottom: var(--space-16);">
  <div style="margin-bottom: var(--space-12);">
    <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: var(--space-2);">
      Mein Account
    </h1>
    <p style="color: var(--gray-600); font-size: 1.125rem;">
      Verwalte deine Kontoinformationen
    </p>
  </div>

  <div style="max-width: 720px;">
    <!-- Account Info Card -->
    <div class="card" style="margin-bottom: var(--space-6);">
      <div class="card-header">
        <h2 class="card-title">Profil-Informationen</h2>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" id="fullname" class="form-input" placeholder="Wird geladen...">
        </div>
        <div class="form-group">
          <label class="form-label">E-Mail-Adresse</label>
          <input type="email" id="email" class="form-input" disabled style="background: var(--gray-50);">
        </div>
        <div id="accountMessage" class="alert" style="display: none; margin-top: var(--space-4);"></div>
      </div>
      <div class="card-footer">
        <button onclick="updateProfile()" class="btn btn-primary">
          Änderungen speichern
        </button>
      </div>
    </div>

    <!-- Password Change Card -->
    <div class="card" style="margin-bottom: var(--space-6);">
      <div class="card-header">
        <h2 class="card-title">Passwort ändern</h2>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">Aktuelles Passwort</label>
          <input type="password" id="currentPassword" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Neues Passwort</label>
          <input type="password" id="newPassword" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Neues Passwort bestätigen</label>
          <input type="password" id="confirmNewPassword" class="form-input">
        </div>
        <div id="passwordMessage" class="alert" style="display: none; margin-top: var(--space-4);"></div>
      </div>
      <div class="card-footer">
        <button onclick="changePassword()" class="btn btn-primary">
          Passwort ändern
        </button>
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="card" style="border-color: var(--error);">
      <div class="card-header">
        <h2 class="card-title" style="color: var(--error);">Gefahrenzone</h2>
      </div>
      <div class="card-body">
        <p style="color: var(--gray-600); margin-bottom: var(--space-4);">
          Das Löschen deines Accounts ist permanent und kann nicht rückgängig gemacht werden.
        </p>
      </div>
      <div class="card-footer">
        <button onclick="deleteAccount()" class="btn" style="background: var(--error); color: white;">
          Account löschen
        </button>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const API_BASE = 'http://localhost:8080/api';

  // Check auth
  if (!window.auth || !window.auth.isLoggedIn()) {
    window.location.href = '/login.html';
  } else {
    initializePage();
  }

  async function initializePage() {
    const user = window.auth.getUser();
    const name = user.fullname ? user.fullname.split(' ')[0] : user.email.split('@')[0];

    document.getElementById('navRight').innerHTML = `
            <div class="nav-profile-dropdown">
                <button class="nav-profile-btn">
                    <span>${name}</span>
                    <span style="font-size: 0.75rem;">▾</span>
                </button>
                <div class="nav-profile-menu">
                    <a href="/account.html">Mein Account</a>
                    <a href="/dashboard.html">Dashboard</a>
                    ${window.auth.hasRole('ADMIN') ? '<div class="divider"></div><a href="/admin-dashboard.html">Admin-Bereich</a>' : ''}
                    <div class="divider"></div>
                    <button onclick="window.auth.logout('/index.html')">Abmelden</button>
                </div>
            </div>
        `;

    // Load user data
    document.getElementById('fullname').value = user.fullname || '';
    document.getElementById('email').value = user.email || '';

    loadNavigationAreas();
  }

  async function loadNavigationAreas() {
    try {
      const response = await fetch(`${API_BASE}/learning-areas`);
      if (!response.ok) return;

      const areas = await response.json();
      const menu = document.getElementById('learningAreasMenu');
      menu.innerHTML = areas
              .sort((a, b) => a.displayOrder - b.displayOrder)
              .map(area => `<li><a href="/learning-area.html?area=${area.slug}">${escapeHtml(area.name)}</a></li>`)
              .join('');
    } catch (error) {
      console.error('Error loading navigation:', error);
    }
  }

  async function updateProfile() {
    const fullname = document.getElementById('fullname').value.trim();

    if (!fullname) {
      showMessage('accountMessage', 'Bitte gib deinen Namen ein.', 'error');
      return;
    }

    try {
      const response = await window.auth.authFetch(`${API_BASE}/users/me`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullname })
      });

      if (response.ok) {
        showMessage('accountMessage', 'Profil erfolgreich aktualisiert!', 'success');
        // Update stored user data
        const user = window.auth.getUser();
        user.fullname = fullname;
        localStorage.setItem('userFullname', fullname);
      } else {
        showMessage('accountMessage', 'Fehler beim Aktualisieren', 'error');
      }
    } catch (error) {
      showMessage('accountMessage', 'Verbindungsfehler', 'error');
    }
  }

  async function changePassword() {
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmNewPassword = document.getElementById('confirmNewPassword').value;

    if (!currentPassword || !newPassword || !confirmNewPassword) {
      showMessage('passwordMessage', 'Bitte fülle alle Felder aus.', 'error');
      return;
    }

    if (newPassword.length < 8) {
      showMessage('passwordMessage', 'Neues Passwort muss mindestens 8 Zeichen lang sein.', 'error');
      return;
    }

    if (newPassword !== confirmNewPassword) {
      showMessage('passwordMessage', 'Passwörter stimmen nicht überein.', 'error');
      return;
    }

    try {
      const response = await window.auth.authFetch(`${API_BASE}/users/change-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword, newPassword })
      });

      if (response.ok) {
        showMessage('passwordMessage', 'Passwort erfolgreich geändert!', 'success');
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmNewPassword').value = '';
      } else {
        showMessage('passwordMessage', 'Aktuelles Passwort ist falsch', 'error');
      }
    } catch (error) {
      showMessage('passwordMessage', 'Verbindungsfehler', 'error');
    }
  }

  async function deleteAccount() {
    if (!confirm('Bist du sicher, dass du deinen Account löschen möchtest? Diese Aktion kann nicht rückgängig gemacht werden!')) {
      return;
    }

    if (!confirm('Wirklich sicher? Alle deine Daten werden permanent gelöscht!')) {
      return;
    }

    try {
      const response = await window.auth.authFetch(`${API_BASE}/users/me`, {
        method: 'DELETE'
      });

      if (response.ok) {
        alert('Account wurde gelöscht.');
        window.auth.logout('/index.html');
      } else {
        alert('Fehler beim Löschen des Accounts');
      }
    } catch (error) {
      alert('Verbindungsfehler');
    }
  }

  function showMessage(elementId, message, type) {
    const div = document.getElementById(elementId);
    div.className = `alert alert-${type}`;
    div.textContent = message;
    div.style.display = 'block';

    setTimeout(() => {
      div.style.display = 'none';
    }, 5000);
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
