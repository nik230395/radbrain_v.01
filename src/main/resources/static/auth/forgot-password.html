<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort vergessen - RadBrain</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-50);
            padding: var(--space-8) var(--space-4);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-xl);
            padding: var(--space-10);
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .auth-icon {
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-6);
            font-size: 2.5rem;
        }

        .auth-title {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: var(--space-3);
        }

        .auth-subtitle {
            color: var(--gray-600);
            line-height: 1.6;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--gray-600);
            text-decoration: none;
            margin-bottom: var(--space-6);
            font-size: 0.9375rem;
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-container">
        <a href="/auth/login.html" class="back-link">
            ← Zurück zur Anmeldung
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">🔑</div>
                <h1 class="auth-title">Passwort vergessen?</h1>
                <p class="auth-subtitle">
                    Kein Problem! Gib deine E-Mail-Adresse ein und wir senden dir einen Link zum Zurücksetzen.
                </p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label class="form-label" for="email">E-Mail-Adresse</label>
                    <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="deine@email.de"
                            required
                            autocomplete="email">
                </div>

                <div id="message" class="alert" style="display: none; margin-bottom: var(--space-4);"></div>

                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn" style="width: 100%;">
                    Link senden
                </button>
            </form>

            <div style="text-align: center; margin-top: var(--space-6); padding-top: var(--space-6); border-top: 1px solid var(--gray-200);">
                <p style="color: var(--gray-600); margin-bottom: var(--space-4); font-size: 0.9375rem;">
                    Erinnerst du dich wieder?
                </p>
                <a href="/auth/login.html" class="btn btn-outline" style="width: 100%;">
                    Zur Anmeldung
                </a>
            </div>
        </div>
    </div>
</div>

<script src="../js/auth.js"></script>
<script>
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
            showMessage('Bitte gib deine E-Mail-Adresse ein.', 'error');
            return;
        }

        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="loading"></div>';

        try {
            const response = await fetch('/api/users/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const result = await response.json();

            if (response.ok) {
                showMessage('Falls die E-Mail-Adresse existiert, haben wir dir einen Link gesendet.', 'success');
                emailInput.value = '';
            } else {
                showMessage(result.error || 'Fehler beim Senden', 'error');
            }
        } catch (error) {
            console.error('Forgot password error:', error);
            showMessage('Verbindungsfehler. Bitte versuche es erneut.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });

    function showMessage(message, type) {
        messageDiv.className = `alert alert-${type}`;
        messageDiv.textContent = message;
        messageDiv.style.display = 'block';
    }

    // Auto-focus email field
    emailInput.focus();
</script>

</body>
</html>
