<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - RadBrain</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gray-50);
            padding: var(--space-8) var(--space-4);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-xl);
            padding: var(--space-10);
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .auth-logo {
            height: 48px;
            margin-bottom: var(--space-6);
        }

        .auth-title {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: var(--space-2);
        }

        .auth-subtitle {
            color: var(--gray-600);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--gray-600);
            text-decoration: none;
            margin-bottom: var(--space-6);
            font-size: 0.9375rem;
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: var(--primary);
        }

        .divider {
            text-align: center;
            margin: var(--space-6) 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gray-200);
        }

        .divider-text {
            position: relative;
            display: inline-block;
            padding: 0 var(--space-4);
            background: white;
            color: var(--gray-500);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-container">
        <a href="/index.html" class="back-link">
            ← Zurück zur Startseite
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <img src="/Bilder/logo.png" alt="RadBrain" class="auth-logo">
                <h1 class="auth-title">Willkommen zurück!</h1>
                <p class="auth-subtitle">Melde dich an, um fortzufahren</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">E-Mail-Adresse</label>
                    <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="deine@email.at"
                            required
                            autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Passwort</label>
                    <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Dein Passwort"
                            required
                            autocomplete="current-password">
                </div>

                <div style="text-align: right; margin-bottom: var(--space-6);">
                    <a href="/auth/forgot-password.html" style="color: var(--primary); font-size: 0.9375rem; text-decoration: none;">
                        Passwort vergessen?
                    </a>
                </div>

                <div id="loginMessage" class="alert" style="display: none; margin-bottom: var(--space-4);"></div>

                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width: 100%;">
                    Anmelden
                </button>
            </form>

            <div class="divider">
                <span class="divider-text">Noch kein Konto?</span>
            </div>

            <a href="/auth/register.html" class="btn btn-outline" style="width: 100%;">
                Jetzt registrieren
            </a>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const messageDiv = document.getElementById('loginMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            showMessage('Bitte fülle alle Felder aus.', 'error');
            return;
        }

        const originalText = loginBtn.textContent;
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<div class="loading"></div>';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();

            if (response.ok) {
                if (result.requiresVerification) {
                    showMessage('Bitte bestätige zuerst deine E-Mail-Adresse.', 'warning');
                    setTimeout(() => {
                        window.location.href = `/verify.html?email=${encodeURIComponent(email)}`;
                    }, 2000);
                    return;
                }

                if (window.auth && window.auth.saveLogin(result)) {
                    showMessage('Anmeldung erfolgreich! Weiterleitung...', 'success');
                    setTimeout(() => {
                        window.location.href = '/userpages/user-home.html';
                    }, 1000);
                } else {
                    throw new Error('Login-Daten konnten nicht gespeichert werden');
                }
            } else {
                showMessage(result.error || 'Anmeldung fehlgeschlagen', 'error');
            }
        } catch (error) {
            console.error('Login error:', error);
            showMessage('Verbindungsfehler. Bitte versuche es erneut.', 'error');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = originalText;
        }
    });

    function showMessage(message, type) {
        messageDiv.className = `alert alert-${type}`;
        messageDiv.textContent = message;
        messageDiv.style.display = 'block';
    }

    emailInput.focus();
</script>

</body>
</html>
