<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Quiz Verwaltung - RadBrain Admin</title>
  <link rel="stylesheet" href="/css/style.css">

  <script src="/js/dropdown.js"></script>
  <style>
    .quiz-list-item {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .status-published { background: #dcfce7; color: #166534; }
    .status-draft { background: #f3f4f6; color: #374151; }
  </style>
</head>
<body>

<div class="container" style="padding-top: 50px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h1>Quiz Verwaltung</h1>
    <a href="/admin/admin-dashboard.html" class="btn btn-ghost">← Zurück</a>
  </div>

  <div id="quizList">Lade Quizzes...</div>
</div>

<script src="/js/auth.js"></script>
<script>
  // Admin-Check
  if (!window.auth || !window.auth.hasRole('ADMIN')) {
    alert('Keine Berechtigung!');
    window.location.href = '/';
  }
  const API_BASE = 'http://localhost:8080/api';

  document.addEventListener('DOMContentLoaded', () => {
    if (!window.auth.hasRole('ADMIN')) { window.location.href = '/'; return; }
    loadQuizzes();
  });

  async function loadQuizzes() {
    try {
      const response = await window.auth.authFetch(`${API_BASE}/secure/admin/quizzes`);
      const quizzes = await response.json();
      const container = document.getElementById('quizList');

      if (quizzes.length === 0) {
        container.innerHTML = '<p>Keine Quizzes gefunden.</p>';
        return;
      }


      container.innerHTML = quizzes.map(q => `
        <div class="quiz-list-item">
            <div>
                <strong>${q.title}</strong>
                <span class="status-badge ${q.isPublished ? 'status-published' : 'status-draft'}">
                    ${q.isPublished ? 'Veröffentlicht' : 'Entwurf'}
                </span>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="/admin/quiz-editor.html?id=${q.id}" class="btn btn-sm" style="background: var(--primary); color: white;">Bearbeiten</a>

                <button onclick="togglePublish(${q.id}, ${q.isPublished})" class="btn btn-sm">
                    ${q.isPublished ? 'Verstecken' : 'Veröffentlichen'}
                </button>
                <button onclick="deleteQuiz(${q.id})" class="btn btn-sm" style="color: red; border-color: red;">Löschen</button>
            </div>
        </div>
    `).join('');
    } catch (error) {
      console.error("Fehler:", error);
    }
  }

  async function togglePublish(id, currentStatus) {
    const action = currentStatus ? 'unpublish' : 'publish';
    await window.auth.authFetch(`${API_BASE}/secure/admin/quizzes/${id}/${action}`, { method: 'POST' });
    loadQuizzes();
  }

  async function deleteQuiz(id) {
    if (confirm('Dieses Quiz unwiderruflich löschen?')) {
      await window.auth.authFetch(`${API_BASE}/secure/admin/quizzes/${id}`, { method: 'DELETE' });
      loadQuizzes();
    }
  }
</script>
</body>
</html>
