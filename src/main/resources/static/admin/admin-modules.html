<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module verwalten - RadBrain Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        .module-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            margin-bottom: var(--space-4);
            transition: all var(--transition-base);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .module-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .module-number {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: var(--space-4);
        }

        /* MODERNER MODAL LOOK (KEIN FULLSCREEN) */
        #moduleModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5); /* Semi-transparentes Slate */
            backdrop-filter: blur(8px); /* Blur-Effekt für den Hintergrund */
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
            align-items: center;
            justify-content: center;
        }

        #moduleModal.show {
            display: flex !important;
            opacity: 1 !important;
        }

        .modal-content-box {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #moduleModal.show .modal-content-box {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px 32px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 32px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 20px 32px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #1e293b; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: #1e293b; }
        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-light); }

        body.modal-open { overflow: hidden !important; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container" style="padding-top: var(--space-12);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-8);">
        <div>
            <h1 id="areaTitle" style="font-size: 2rem;">Module laden...</h1>
            <p style="color: var(--gray-600);">Verwalte die Kapitel dieses Lernbereichs</p>
        </div>
        <button onclick="openModuleModal()" class="btn btn-primary" style="padding: 10px 20px;">+ Neues Modul</button>
    </div>

    <div id="modulesList">
        <div style="text-align: center; padding: 50px;"><div class="loading"></div></div>
    </div>
</div>

<div id="moduleModal" onclick="if(event.target === this) closeModuleModal()">
    <div class="modal-content-box">
        <div class="modal-header">
            <h2 id="modalTitle" style="margin: 0; font-size: 1.5rem;">Modul bearbeiten</h2>
            <button class="close-btn" onclick="closeModuleModal()">&times;</button>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Titel des Moduls</label>
                <input type="text" id="moduleTitle" class="form-input" placeholder="z.B. Anatomie des Thorax">
            </div>

            <div class="form-group">
                <label class="form-label">Beschreibung</label>
                <textarea id="moduleDescription" class="form-input" rows="4" placeholder="Kurze Inhaltsangabe..."></textarea>
            </div>

            <div class="form-group" style="width: 150px;">
                <label class="form-label">Reihenfolge</label>
                <input type="number" id="moduleOrder" class="form-input" value="0">
            </div>
        </div>

        <div class="modal-footer">
            <button onclick="closeModuleModal()" class="btn btn-ghost">Abbrechen</button>
            <button onclick="saveModule()" class="btn btn-primary">Speichern</button>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api';
    const urlParams = new URLSearchParams(window.location.search);
    const areaId = urlParams.get('areaId');
    let editingModuleId = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (!window.auth || !window.auth.isLoggedIn()) {
            window.location.href = '/auth/login.html';
            return;
        }
        if (!areaId) {
            window.location.href = '/admin/admin-learning-areas.html';
            return;
        }
        loadModules();
    });

    async function loadModules() {
        try {
            const response = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/${areaId}`);
            if (response.ok) {
                const area = await response.json();
                document.getElementById('areaTitle').textContent = area.name;
                renderModules(area.modules || []);
            }
        } catch (error) { console.error(error); }
    }

    function renderModules(modules) {
        const container = document.getElementById('modulesList');
        if (modules.length === 0) {
            container.innerHTML = '<div class="card">Keine Module vorhanden.</div>';
            return;
        }

        container.innerHTML = modules.sort((a,b) => a.displayOrder - b.displayOrder).map(m => `
            <div class="module-card">
                <div style="display: flex; align-items: center;">
                    <div class="module-number">${m.displayOrder}</div>
                    <div>
                        <h3 style="margin: 0; font-size: 1.1rem;">${m.title}</h3>
                        <p style="color: var(--gray-600); font-size: 0.9rem; margin: 4px 0 0 0;">${m.description || ''}</p>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <a href="/admin/admin-content.html?moduleId=${m.id}" class="btn btn-sm btn-primary">Inhalte</a>
                    <button onclick="openModuleModal(${m.id}, '${m.title.replace(/'/g, "\\'")}', '${(m.description || '').replace(/'/g, "\\'")}', ${m.displayOrder})" class="btn btn-sm btn-secondary">Edit</button>
                    <button onclick="deleteModule(${m.id})" class="btn btn-sm" style="color: #ef4444; border: 1px solid #fee2e2; background: #fef2f2;">Löschen</button>
                </div>
            </div>
        `).join('');
    }

    function openModuleModal(id = null, title = '', desc = '', order = 0) {
        editingModuleId = id;
        document.getElementById('modalTitle').textContent = id ? 'Modul bearbeiten' : 'Neues Modul';
        document.getElementById('moduleTitle').value = title;
        document.getElementById('moduleDescription').value = desc;
        document.getElementById('moduleOrder').value = order;

        const modal = document.getElementById('moduleModal');
        document.body.classList.add('modal-open');
        modal.classList.add('show');
    }

    function closeModuleModal() {
        const modal = document.getElementById('moduleModal');
        modal.classList.remove('show');
        document.body.classList.remove('modal-open');
    }

    async function saveModule() {
        const title = document.getElementById('moduleTitle').value;
        const description = document.getElementById('moduleDescription').value;
        const displayOrder = parseInt(document.getElementById('moduleOrder').value);

        const url = editingModuleId
            ? `${API_BASE}/admin/learning-areas/modules/${editingModuleId}`
            : `${API_BASE}/admin/learning-areas/${areaId}/modules`;

        try {
            const res = await window.auth.authFetch(url, {
                method: editingModuleId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, displayOrder, learningAreaId: areaId })
            });

            if (res.ok) {
                closeModuleModal();
                loadModules();
            }
        } catch (e) { console.error(e); }
    }

    async function deleteModule(id) {
        if (!confirm('Dieses Modul und alle enthaltenen Bilder/Texte wirklich löschen?')) return;
        try {
            const res = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/modules/${id}`, {
                method: 'DELETE'
            });
            if (res.ok) loadModules();
        } catch (e) { console.error(e); }
    }
</script>
</body>
</html>
