<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module verwalten - RadBrain Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        .module-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            margin-bottom: var(--space-4);
            transition: all var(--transition-base);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .module-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
        }
        .module-number {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: var(--space-4);
        }

        /* ECHTES FULLSCREEN MODAL */
        #moduleModal {
            display: none;
            position: fixed;
            /* Erzwingt Fullscreen über den gesamten Viewport */
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: #ffffff;
            z-index: 99999;
            overflow-y: auto;

            /* Animation von unten */
            opacity: 0;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        #moduleModal.show {
            display: block !important;
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        .modal-inner-content {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 20px 60px 20px;
        }

        /* Fixer Schließen-Knopf oben rechts */
        .close-fullscreen {
            position: fixed;
            top: 25px;
            right: 40px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            font-size: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }

        .form-group { margin-bottom: 25px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 10px; font-size: 1.1rem; }
        .input-xl { font-size: 1.2rem !important; padding: 15px !important; }

        body.modal-open { overflow: hidden !important; }
    </style>
</head>
<body>



<div class="container" style="padding-top: var(--space-12);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-8);">
        <div>
            <h1 id="areaTitle" style="font-size: 2.5rem;">Module laden...</h1>
            <p style="color: var(--gray-600);">Verwalte die Kapitel dieses Lernbereichs</p>
        </div>
        <button onclick="openModuleModal()" class="btn btn-primary" style="padding: 12px 25px;">+ Neues Modul</button>
    </div>

    <div id="modulesList">
        <div style="text-align: center; padding: 50px;"><div class="loading"></div></div>
    </div>
</div>

<div id="moduleModal">
    <button class="close-fullscreen" onclick="closeModuleModal()">&times;</button>

    <div class="modal-inner-content">
        <h1 id="modalTitle" style="font-size: 2.8rem; margin-bottom: 40px;">Modul bearbeiten</h1>

        <div class="form-group">
            <label class="form-label">Titel des Moduls</label>
            <input type="text" id="moduleTitle" class="form-control input-xl" placeholder="z.B. Anatomie des Thorax">
        </div>

        <div class="form-group">
            <label class="form-label">Beschreibung</label>
            <textarea id="moduleDescription" class="form-control input-xl" rows="6"></textarea>
        </div>

        <div class="form-group" style="width: 200px;">
            <label class="form-label">Reihenfolge</label>
            <input type="number" id="moduleOrder" class="form-control input-xl" value="0">
        </div>

        <div style="margin-top: 50px; display: flex; gap: 15px;">
            <button onclick="saveModule()" class="btn btn-primary" style="padding: 15px 45px; font-size: 1.1rem;">Speichern</button>
            <button onclick="closeModuleModal()" class="btn btn-ghost">Abbrechen</button>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api';
    const urlParams = new URLSearchParams(window.location.search);
    const areaId = urlParams.get('areaId');
    let editingModuleId = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (!window.auth || !window.auth.isLoggedIn()) {
            window.location.href = '/auth/login.html';
            return;
        }
        if (!areaId) {
            window.location.href = '/admin/admin-learning-areas.html';
            return;
        }
        loadModules();
    });

    async function loadModules() {
        const container = document.getElementById('modulesList');
        try {
            const response = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/${areaId}`);
            if (response.ok) {
                const area = await response.json();
                document.getElementById('areaTitle').textContent = area.name;
                renderModules(area.modules || []);
            }
        } catch (error) { console.error(error); }
    }

    function renderModules(modules) {
        const container = document.getElementById('modulesList');
        if (modules.length === 0) {
            container.innerHTML = '<div class="card">Keine Module vorhanden.</div>';
            return;
        }

        container.innerHTML = modules.sort((a,b) => a.displayOrder - b.displayOrder).map(m => `
            <div class="module-card">
                <div style="display: flex; align-items: center;">
                    <div class="module-number">${m.displayOrder}</div>
                    <div>
                        <h3 style="margin: 0;">${m.title}</h3>
                        <p style="color: var(--gray-600); margin: 4px 0 0 0;">${m.description || ''}</p>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <a href="/admin/admin-content.html?moduleId=${m.id}" class="btn btn-sm btn-primary">Inhalte</a>
                    <button onclick="openModuleModal(${m.id}, '${m.title.replace(/'/g, "\\'")}', '${(m.description || '').replace(/'/g, "\\'")}', ${m.displayOrder})" class="btn btn-sm btn-secondary">Edit</button>
                    <button onclick="deleteModule(${m.id})" class="btn btn-sm" style="color: red; border: 1px solid red;">Löschen</button>
                </div>
            </div>
        `).join('');
    }

    function openModuleModal(id = null, title = '', desc = '', order = 0) {
        editingModuleId = id;
        document.getElementById('modalTitle').textContent = id ? 'Modul bearbeiten' : 'Neues Modul';
        document.getElementById('moduleTitle').value = title;
        document.getElementById('moduleDescription').value = desc;
        document.getElementById('moduleOrder').value = order;

        const modal = document.getElementById('moduleModal');
        modal.style.display = 'block';
        document.body.classList.add('modal-open');
        setTimeout(() => modal.classList.add('show'), 10);
    }

    function closeModuleModal() {
        const modal = document.getElementById('moduleModal');
        modal.classList.remove('show');
        document.body.classList.remove('modal-open');
        setTimeout(() => modal.style.display = 'none', 400);
    }

    async function saveModule() {
        const title = document.getElementById('moduleTitle').value;
        const description = document.getElementById('moduleDescription').value;
        const displayOrder = parseInt(document.getElementById('moduleOrder').value);

        const url = editingModuleId
            ? `${API_BASE}/admin/learning-areas/modules/${editingModuleId}`
            : `${API_BASE}/admin/learning-areas/${areaId}/modules`;

        try {
            const res = await window.auth.authFetch(url, {
                method: editingModuleId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description, displayOrder, learningAreaId: areaId })
            });

            if (res.ok) {
                closeModuleModal();
                loadModules();
            }
        } catch (e) { console.error(e); }
    }

    async function deleteModule(id) {
        if (!confirm('Modul wirklich löschen?')) return;
        try {
            const res = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/modules/${id}`, {
                method: 'DELETE'
            });
            if (res.ok) loadModules();
        } catch (e) { console.error(e); }
    }
</script>
</body>
</html>
