<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Quiz bearbeiten - RadBrain Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/dropdown.js"></script>
  <style>
    .question-block { background: #f9fafb; border: 1px solid #e5e7eb; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .choice-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .choice-row input[type="text"] { flex: 1; padding: 5px; }
  </style>
</head>
<body>
<div class="container" style="padding: 40px 20px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 12px; box-shadow: var(--shadow-sm);">
    <div>
      <a href="/admin/quiz-verwaltung.html" class="btn btn-outline" style="text-decoration: none; padding: 8px 16px;">
        ← Abbrechen & Zurück
      </a>
    </div>

    <h1 id="editTitle" style="margin: 0; font-size: 1.5rem;">Quiz laden...</h1>

    <div>
      <button onclick="saveAll()" class="btn btn-primary" id="saveBtn">
        💾 Alles Speichern
      </button>
    </div>
  </div>

  <div id="editorContent"></div>
</div>

<script src="/js/auth.js"></script>
<script>
  // Admin-Check
  if (!window.auth || !window.auth.hasRole('ADMIN')) {
    alert('Keine Berechtigung!');
    window.location.href = '/';
  }
  const API_BASE = 'http://localhost:8080/api';
  const urlParams = new URLSearchParams(window.location.search);
  const quizId = urlParams.get('id');
  let quizData = null;

  document.addEventListener('DOMContentLoaded', () => {
    if (!quizId) {
      alert("Keine Quiz-ID angegeben!");
      window.location.href = '/admin/quiz-verwaltung.html';
      return;
    }
    loadQuizData();
  });

  async function loadQuizData() {
    try {
      // Wir nutzen den public endpoint zum Laden der Details
      const res = await window.auth.authFetch(`${API_BASE}/quizzes/${quizId}`);
      if (!res.ok) throw new Error("Quiz konnte nicht geladen werden");

      quizData = await res.json();
      document.getElementById('editTitle').textContent = `Bearbeite: ${quizData.title}`;
      renderEditor();
    } catch (error) {
      console.error(error);
      alert("Fehler beim Laden der Daten.");
    }
  }

  function renderEditor() {
    const container = document.getElementById('editorContent');
    if (!quizData.questions || quizData.questions.length === 0) {
      container.innerHTML = '<div class="card">Dieses Quiz hat noch keine Fragen.</div>';
      return;
    }

    container.innerHTML = quizData.questions.map((q, qIndex) => `
            <div class="question-block" id="q-block-${q.id}">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <strong>Frage ${qIndex + 1}</strong>
                    <span style="font-size: 0.8rem; color: var(--gray-500);">${q.qtype}</span>
                </div>

                <textarea style="width:100%; min-height: 60px; padding: 10px; border-radius: 8px; border: 1px solid var(--gray-300);"
                          id="q-text-${q.id}">${q.text}</textarea>

                <div style="margin-top: 15px;">
                    <strong style="display: block; margin-bottom: 10px; font-size: 0.9rem;">Antwortoptionen (Haken setzen für 'Richtig'):</strong>
                    ${q.choices.map(c => `
                        <div class="choice-row">
                            <input type="checkbox" id="c-correct-${c.id}" ${c.isCorrect ? 'checked' : ''}
                                   style="width: 20px; height: 20px; cursor: pointer;">
                            <input type="text" id="c-text-${c.id}" value="${c.text}"
                                   style="flex: 1; padding: 8px; border: 1px solid var(--gray-200); border-radius: 4px;">
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
  }

  async function saveAll() {
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = '⏳ Speichere...';

    try {
      for (let q of quizData.questions) {
        // 1. Frage updaten
        const newText = document.getElementById(`q-text-${q.id}`).value;
        await window.auth.authFetch(`${API_BASE}/questions/${q.id}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ text: newText })
        });

        // 2. Jede Antwort (Choice) updaten
        for (let c of q.choices) {
          const cText = document.getElementById(`c-text-${c.id}`).value;
          const cCorrect = document.getElementById(`c-correct-${c.id}`).checked;

          await window.auth.authFetch(`${API_BASE}/choices/${c.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              text: cText,
              isCorrect: cCorrect
            })
          });
        }
      }
      alert("✅ Änderungen erfolgreich gespeichert!");
    } catch (e) {
      console.error(e);
      alert("❌ Fehler beim Speichern einzelner Elemente.");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '💾 Alles Speichern';
    }
  }
</script>
</body>
</html>
