<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Quiz Editor - RadBrain Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <style>
    :root { --primary: #2563eb; --success: #166534; --error: #991b1b; }
    .quiz-info-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .question-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 16px; position: relative; }
    .question-card.editing { border: 2px solid var(--primary); background: #f0f7ff; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .badge-mc { background: #dbeafe; color: #1e40af; }
    .edit-choice-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; padding: 10px; background: white; border: 1px solid #e2e8f0; border-radius: 8px; }
    .alert { position: fixed; top: 20px; right: 20px; padding: 15px; border-radius: 8px; z-index: 10000; color: white; min-width: 250px; font-weight: bold; }
    .alert-success { background: var(--success); }
    .alert-error { background: var(--error); }
    .btn-save { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .form-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container" style="padding: 40px 20px;">
  <div id="editorContainer">
    <div class="quiz-info-card">
      <h2>Quiz bearbeiten</h2>
      <input type="text" id="quizTitle" class="form-input" placeholder="Quiz Titel">
      <button onclick="saveQuizInfo()" class="btn btn-primary" style="margin-top: 15px;">Titel speichern</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Fragen (<span id="questionCount">0</span>)</h2>
      <button onclick="addQuestion()" class="btn btn-primary">+ Neue Frage</button>
    </div>
    <div id="questionsContainer"></div>
  </div>
  <div id="messageContainer"></div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
  const API_BASE = 'http://localhost:8080/api';
  const quizId = new URLSearchParams(window.location.search).get('id');
  let questions = [];
  let editingId = null;

  document.addEventListener('DOMContentLoaded', () => { if(quizId) loadQuiz(); });

  async function loadQuiz() {
    try {
      const res = await window.auth.authFetch(`${API_BASE}/admin/quizzes/${quizId}`);
      const result = await res.json();
      const data = result.data || result;
      document.getElementById('quizTitle').value = data.title || '';

      // Wichtig: IDs explizit als Number speichern
      questions = (data.questions || []).map(q => ({
        ...q,
        id: Number(q.id),
        choices: (q.choices || []).map(c => ({...c, id: Number(c.id)}))
      }));

      renderQuestions();
    } catch (e) { showMessage('Fehler beim Laden des Quiz', 'error'); }
  }

  function getTypeLabel(type) {
    if (!type) return "MULTIPLE CHOICE";
    return type.toString().toUpperCase().replace('_', ' ');
  }

  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    document.getElementById('questionCount').textContent = questions.length;

    container.innerHTML = questions.map((q, idx) => {
      if (editingId === q.id) return renderEditMode(q);
      return `
                <div class="question-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span class="badge badge-mc">${getTypeLabel(q.qtype)}</span>
                        <div>
                            <button onclick="startEdit(${q.id})" class="btn btn-sm">Bearbeiten</button>
                            <button onclick="deleteQuestion(${q.id})" class="btn btn-sm" style="color:red">Löschen</button>
                        </div>
                    </div>
                    <p><strong>${q.text}</strong></p>
                    <div style="margin-top:10px;">
                        ${(q.choices || []).map(c => `
                            <div style="padding:4px; ${c.isCorrect ? 'color:#166534; font-weight:bold;' : ''}">
                                ${c.isCorrect ? '✔' : '○'} ${c.choiceText || c.text || 'Kein Text'}
                            </div>`).join('')}
                    </div>
                </div>`;
    }).join('');
  }

  function renderEditMode(q) {
    return `
            <div class="question-card editing">
                <label><strong>Fragetext:</strong></label>
                <input type="text" id="edit-q-text" class="form-input" value="${q.text}" style="margin-bottom:15px;">

                <label><strong>Antworten:</strong></label>
                <div id="edit-choices-list">
                    ${q.choices.map((c) => `
                        <div class="edit-choice-row">
                            <input type="checkbox" class="edit-choice-correct" ${c.isCorrect ? 'checked' : ''} data-choice-id="${c.id}">
                            <input type="text" class="edit-choice-text" value="${c.choiceText || c.text || ''}" data-choice-id="${c.id}" style="flex:1;">
                        </div>`).join('')}
                </div>
                <div style="margin-top:20px; display:flex; gap:10px;">
                    <button onclick="saveEdit(${q.id})" class="btn-save">Änderungen speichern</button>
                    <button onclick="startEdit(null)" class="btn">Abbrechen</button>
                </div>
            </div>`;
  }

  function startEdit(id) {
    editingId = id ? Number(id) : null;
    renderQuestions();
  }

  async function saveEdit(qId) {
    const q = questions.find(x => x.id === qId);
    if (!q) return showMessage("Fehler: Frage lokal nicht gefunden", "error");

    const newText = document.getElementById('edit-q-text').value;

    // Daten für das Backend
    const qUpdate = {
      text: newText,
      qtype: q.qtype || "MULTIPLE_CHOICE"
    };

    try {
      // SAUBERER URL-BAU:
      // Wir nehmen die API_BASE (http://localhost:8080/api)
      // und hängen EXAKT den Pfad aus dem Java-Controller an.
      const url = `${API_BASE}/admin/questions/${qId}`;

      console.log("Prüfe diese URL in den DevTools:", url);

      const qRes = await window.auth.authFetch(url, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(qUpdate)
      });

      if (!qRes.ok) {
        if (qRes.status === 404) {
          throw new Error("Pfad nicht gefunden (404). Prüfe die URL in der Konsole!");
        }
        const errData = await qRes.json();
        throw new Error(errData.error || "Update fehlgeschlagen");
      }

      // Falls Frage ok, dann Choices speichern
      const choiceRows = document.querySelectorAll('.edit-choice-row');
      for (const row of choiceRows) {
        const cId = row.querySelector('.edit-choice-text').dataset.choiceId;
        const cBody = {
          text: row.querySelector('.edit-choice-text').value,
          isCorrect: row.querySelector('.edit-choice-correct').checked
        };

        // Pfad für Choices: /api/admin/choices/{id}
        await window.auth.authFetch(`${API_BASE}/admin/choices/${cId}`, {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(cBody)
        });
      }

      showMessage('✓ Erfolgreich gespeichert', 'success');
      editingId = null;
      loadQuiz();
    } catch (e) {
      console.error("DevTools Info:", e);
      showMessage(e.message, 'error');
    }
  }

  async function saveQuizInfo() {
    const title = document.getElementById('quizTitle').value;
    try {
      const res = await window.auth.authFetch(`${API_BASE}/admin/quizzes/${quizId}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ title: title })
      });
      if(res.ok) showMessage('Quiz-Titel aktualisiert', 'success');
    } catch(e) { showMessage('Fehler beim Quiz-Update', 'error'); }
  }

  async function addQuestion() {
    const txt = prompt('Neue Frage eingeben:');
    if (!txt) return;
    try {
      const res = await window.auth.authFetch(`${API_BASE}/admin/questions`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ quizId: quizId, qtype: 'MULTIPLE_CHOICE', text: txt })
      });
      if (res.ok) loadQuiz();
    } catch (e) { showMessage('Fehler beim Erstellen der Frage', 'error'); }
  }

  async function deleteQuestion(id) {
    if (confirm('Diese Frage wirklich unwiderruflich löschen?')) {
      await window.auth.authFetch(`${API_BASE}/admin/questions/${id}`, { method: 'DELETE' });
      loadQuiz();
    }
  }

  function showMessage(m, t) {
    const c = document.getElementById('messageContainer');
    c.innerHTML = `<div class="alert alert-${t}">${m}</div>`;
    setTimeout(() => c.innerHTML = '', 4000);
  }
</script>
</body>
</html>
