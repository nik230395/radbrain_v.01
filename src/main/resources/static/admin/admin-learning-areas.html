<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernmodule verwalten - RadBrain Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        .areas-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .areas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header-content p {
            color: var(--gray-600);
            font-size: 1.1rem;
        }

        .area-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .area-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .area-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .area-card:hover::before {
            opacity: 1;
        }

        .area-header {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .area-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
        }

        .area-main-info {
            flex: 1;
        }

        .area-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .area-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
            margin: 0;
        }

        .area-subtitle {
            color: var(--gray-700);
            font-size: 1rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .area-meta {
            display: flex;
            gap: 20px;
            color: var(--gray-600);
            font-size: 0.9rem;
            margin-top: 12px;
        }

        .area-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-published {
            background: #dcfce7;
            color: #166534;
        }

        .status-draft {
            background: #f3f4f6;
            color: #6b7280;
        }

        .area-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
        }

        .quick-edit-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }

        .quick-edit-toggle {
            background: var(--gray-50);
            border: 1px solid var(--gray-300);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            font-weight: 500;
        }

        .quick-edit-toggle:hover {
            background: var(--gray-100);
        }

        .quick-edit-content {
            display: none;
            padding: 20px;
            background: var(--gray-50);
            border-radius: 8px;
            margin-top: 10px;
        }

        .quick-edit-content.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .edit-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .edit-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .edit-form-group label {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--gray-700);
        }

        .edit-form-group input,
        .edit-form-group textarea {
            padding: 10px 12px;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            font-size: 0.9375rem;
            font-family: inherit;
        }

        .edit-form-group input:focus,
        .edit-form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: 16px;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .area-header {
                flex-direction: column;
            }

            .area-actions {
                width: 100%;
            }

            .edit-form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="areas-container">
    <!-- Header -->
    <div class="areas-header">
        <div class="header-content">
            <h1>Lernmodule</h1>
            <p>Verwalte Lernmodule, Module und Inhalte</p>
        </div>
        <div style="display: flex; gap: 12px;">
            <button onclick="createArea()" class="btn btn-primary btn-lg">
                + Neuer Lernbereich
            </button>
            <a href="/admin/admin-dashboard.html" class="btn btn-outline">
                ← Dashboard
            </a>
        </div>
    </div>

    <!-- Areas List -->
    <div id="areasList">
        <div style="text-align: center; padding: 60px;">
            <div class="loading" style="width: 50px; height: 50px; margin: 0 auto 20px; border: 4px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <p style="color: var(--gray-600);">Lade Lernmodule...</p>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/navbar.js"></script>
<script>
    // Admin-Check
    if (!window.auth || !window.auth.hasRole('ADMIN')) {
        alert('Keine Berechtigung!');
        window.location.href = '/';
    }

    const API_BASE = 'http://localhost:8080/api';

    document.addEventListener('DOMContentLoaded', () => {
        loadAreas();
    });

    async function loadAreas() {
        console.log('Loading learning areas...');
        try {
            const response = await window.auth.authFetch(`${API_BASE}/admin/learning-areas`);

            if (response.ok) {
                const areas = await response.json();
                console.log('Areas loaded:', areas);
                renderAreas(areas);
            } else {
                console.error('Server error:', response.status);
                showError(`Fehler beim Laden (Status ${response.status})`);
            }
        } catch (error) {
            console.error('Connection error:', error);
            showError('Verbindung zum Server fehlgeschlagen');
        }
    }

    function renderAreas(areas) {
        const container = document.getElementById('areasList');

        if (!areas || areas.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"></div>
                    <h3 style="font-size: 1.5rem; color: var(--gray-600); margin-bottom: 12px;">
                        Noch keine Lernmodule vorhanden
                    </h3>
                    <p style="color: var(--gray-500); margin-bottom: 24px;">
                        Erstelle deinen ersten Lernbereich um zu beginnen
                    </p>
                    <button onclick="createArea()" class="btn btn-primary">
                        + Lernbereich erstellen
                    </button>
                </div>
            `;
            return;
        }

        // Sort by display order
        areas.sort((a, b) => a.displayOrder - b.displayOrder);

        container.innerHTML = areas.map(area => `
            <div class="area-card" id="area-${area.id}">
                <div class="area-header">


                    <div class="area-main-info">
                        <div class="area-title-row">
                            <h3 class="area-title">${escapeHtml(area.name)}</h3>
                            <span class="status-badge ${area.isPublished ? 'status-published' : 'status-draft'}">
                                ${area.isPublished ? '✓ Veröffentlicht' : '○ Entwurf'}
                            </span>
                        </div>

                        ${area.subtitle ? `
                            <p class="area-subtitle">${escapeHtml(area.subtitle)}</p>
                        ` : ''}

                        <div class="area-meta">
                            <span>ID: ${area.id}</span>
                            <span>${area.moduleCount || 0} Module</span>
                            <span>Reihenfolge: ${area.displayOrder}</span>
                        </div>
                    </div>

                    <div class="area-actions">
                        <a href="/admin/admin-modules.html?areaId=${area.id}" class="btn btn-primary" style="width: 100%;">
                            Module verwalten
                        </a>
                        <button onclick="toggleQuickEdit(${area.id})" class="btn btn-secondary" style="width: 100%;">
                            Schnell bearbeiten
                        </button>
                        <button onclick="togglePublish(${area.id}, ${area.isPublished})" class="btn btn-outline" style="width: 100%;">
                            ${area.isPublished ? 'Verstecken' : 'Veröffentlichen'}
                        </button>
                        <button onclick="deleteArea(${area.id}, '${escapeHtml(area.name)}')" class="btn" style="width: 100%; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;">
                            Löschen
                        </button>
                    </div>
                </div>

                <!-- Quick Edit Section (Hidden by default) -->
                <div class="quick-edit-section" id="quick-edit-${area.id}" style="display: none;">
                    <div class="quick-edit-content active">
                        <h4 style="margin-bottom: 15px; font-size: 1.1rem;">Schnellbearbeitung</h4>

                        <div class="edit-form-row">
                            <div class="edit-form-group">
                                <label>Name *</label>
                                <input type="text" id="edit-name-${area.id}" value="${escapeHtml(area.name)}">
                            </div>
                            <div class="edit-form-group">
                                <label>Slug *</label>
                                <input type="text" id="edit-slug-${area.id}" value="${escapeHtml(area.slug)}">
                            </div>
                        </div>

                        <div class="edit-form-group">
                            <label>Untertitel</label>
                            <input type="text" id="edit-subtitle-${area.id}" value="${escapeHtml(area.subtitle || '')}">
                        </div>

                        <div class="edit-form-group">
                            <label>Beschreibung</label>
                            <textarea id="edit-description-${area.id}" rows="3">${escapeHtml(area.description || '')}</textarea>
                        </div>

                        <div class="edit-form-row">
                            <div class="edit-form-group">
                                <label>Farbe</label>
                                <input type="color" id="edit-color-${area.id}" value="${area.colorTheme || '#667eea'}" style="height: 45px; cursor: pointer;">
                            </div>
                            <div class="edit-form-group">
                                <label>Reihenfolge</label>
                                <input type="number" id="edit-order-${area.id}" value="${area.displayOrder}" min="0">
                            </div>
                        </div>

                        <div class="edit-actions">
                            <button onclick="saveQuickEdit(${area.id})" class="btn btn-primary">
                                Änderungen speichern
                            </button>
                            <button onclick="toggleQuickEdit(${area.id})" class="btn btn-ghost">
                                ✕ Abbrechen
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function toggleQuickEdit(areaId) {
        const editSection = document.getElementById(`quick-edit-${areaId}`);
        if (editSection.style.display === 'none') {
            editSection.style.display = 'block';
        } else {
            editSection.style.display = 'none';
        }
    }

    async function saveQuickEdit(areaId) {
        const name = document.getElementById(`edit-name-${areaId}`).value.trim();
        const slug = document.getElementById(`edit-slug-${areaId}`).value.trim();
        const subtitle = document.getElementById(`edit-subtitle-${areaId}`).value.trim();
        const description = document.getElementById(`edit-description-${areaId}`).value.trim();
        const colorTheme = document.getElementById(`edit-color-${areaId}`).value;
        const displayOrder = parseInt(document.getElementById(`edit-order-${areaId}`).value);

        if (!name || !slug) {
            alert('Name und Slug sind erforderlich!');
            return;
        }

        try {
            const response = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/${areaId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name,
                    slug,
                    subtitle: subtitle || null,
                    description: description || null,
                    colorTheme,
                    displayOrder,
                    isPublished: true // Keep current published state
                })
            });

            if (response.ok) {
                alert('Änderungen gespeichert!');
                toggleQuickEdit(areaId);
                loadAreas(); // Reload to show changes
            } else {
                alert('Fehler beim Speichern');
            }
        } catch (error) {
            console.error('Save error:', error);
            alert('Verbindungsfehler');
        }
    }

    async function togglePublish(id, currentStatus) {
        try {
            // First get the current area data
            const getRes = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/${id}`);
            if (!getRes.ok) throw new Error('Bereich nicht gefunden');

            const area = await getRes.json();
            area.isPublished = !currentStatus;

            // Update with new publish status
            const putRes = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(area)
            });

            if (putRes.ok) {
                loadAreas();
            } else {
                alert('Fehler beim Ändern des Status');
            }
        } catch (error) {
            console.error('Toggle publish error:', error);
            alert('Fehler: ' + error.message);
        }
    }

    function createArea() {
        window.location.href = '/admin/learning-area-editor.html';
    }

    async function deleteArea(id, name) {
        if (!confirm(`"${name}" wirklich löschen?\n\nAlle Module und Inhalte gehen verloren!`)) {
            return;
        }

        try {
            const response = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadAreas();
            } else {
                alert('Fehler beim Löschen');
            }
        } catch (error) {
            console.error('Delete error:', error);
            alert('Fehler beim Löschen');
        }
    }

    function showError(message) {
        document.getElementById('areasList').innerHTML = `
            <div style="text-align: center; padding: 60px; background: white; border: 1px solid var(--gray-200); border-radius: 16px;">
                <p style="color: var(--error); font-size: 1.1rem;">${message}</p>
            </div>
        `;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // CSS for spinner animation
    const style = document.createElement('style');
    style.textContent = `
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    `;
    document.head.appendChild(style);
</script>

</body>
</html>
