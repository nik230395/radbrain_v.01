<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernbereiche verwalten - RadBrain Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
</head>
<body>

<div class="container" style="padding-top: var(--space-12); padding-bottom: var(--space-16);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-12);">
        <div>
            <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: var(--space-2);">
                Lernbereiche
            </h1>
            <p style="color: var(--gray-600); font-size: 1.125rem;">
                Verwalte Lernbereiche, Module und Inhalte
            </p>
        </div>
        <button onclick="createArea()" class="btn btn-primary">
            + Neuer Lernbereich
        </button>
    </div>

    <div id="areasList" style="display: grid; gap: var(--space-4);">
        <div style="text-align: center; padding: var(--space-12);">
            <div class="loading" style="width: 40px; height: 40px; margin: 0 auto;"></div>
            <p>Lade Lernbereiche...</p>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/dropdown.js"></script>
<script src="/js/navbar.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api';

    // Zentrale Initialisierung
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Sicherheits-Check: Ist der User Admin?
        if (!window.auth || !window.auth.isLoggedIn()) {
            window.location.href = '/auth/login.html';
            return;
        }

        if (!window.auth.hasRole('ADMIN')) {
            alert('Keine Berechtigung!');
            window.location.href = '/userpages/user-home.html';
            return;
        }

        // 2. Wenn Admin, dann Daten laden
        loadAreas();
    });

    async function loadAreas() {
        console.log("=== LADE LERNBEREICHE ===");
        try {
            const response = await window.auth.authFetch(`${API_BASE}/admin/learning-areas`);

            if (response.ok) {
                const areas = await response.json();
                renderAreas(areas);
            } else {
                console.error("Server-Fehler:", response.status);
                document.getElementById('areasList').innerHTML = `
                    <p style="text-align:center; color:var(--error);">
                        Fehler beim Laden (Status ${response.status}).
                    </p>`;
            }
        } catch (error) {
            console.error("Verbindungsfehler:", error);
            document.getElementById('areasList').innerHTML = `
                <p style="text-align:center; color:var(--error);">
                    Verbindung zum Server fehlgeschlagen.
                </p>`;
        }
    }

    function renderAreas(areas) {
        const container = document.getElementById('areasList');

        if (!areas || areas.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: var(--space-12);">
                    <p style="color: var(--gray-600);">Noch keine Lernbereiche vorhanden.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = areas.sort((a, b) => a.displayOrder - b.displayOrder).map(area => `
            <div class="card">
                <div style="display: flex; align-items: flex-start; gap: var(--space-6);">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2);">
                            <h3 style="font-size: 1.5rem; font-weight: 600; margin: 0;">
                                ${escapeHtml(area.name)}
                            </h3>
                            <span class="badge ${area.isPublished ? 'badge-success' : 'badge-warning'}">
                                ${area.isPublished ? 'Veröffentlicht' : 'Entwurf'}
                            </span>
                        </div>
                        ${area.subtitle ? `<p style="color: var(--gray-700);">${escapeHtml(area.subtitle)}</p>` : ''}
                        <div style="display: flex; gap: var(--space-6); color: var(--gray-500); font-size: 0.875rem; margin-top: 10px;">
                            <span>ID: ${area.id}</span>
                            <span>${area.moduleCount || 0} Module</span>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: var(--space-2);">
                        <a href="/admin/admin-modules.html?areaId=${area.id}" class="btn btn-sm btn-primary">Module</a>
                        <button onclick="editArea(${area.id})" class="btn btn-sm btn-secondary">Bearbeiten</button>
                        <button onclick="togglePublish(${area.id}, ${area.isPublished})" class="btn btn-sm btn-outline">
                            ${area.isPublished ? 'Verstecken' : 'Veröffentlichen'}
                        </button>
                        <button onclick="deleteArea(${area.id}, '${escapeHtml(area.name)}')" class="btn btn-sm" style="background: var(--error); color: white;">Löschen</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function togglePublish(id, currentStatus) {
        const targetUrl = `${API_BASE}/admin/learning-areas/${id}`;
        try {
            const getRes = await window.auth.authFetch(targetUrl);
            if (!getRes.ok) throw new Error("Bereich nicht gefunden");

            const area = await getRes.json();
            area.isPublished = !currentStatus;

            const putRes = await window.auth.authFetch(targetUrl, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(area)
            });

            if (putRes.ok) {
                loadAreas();
            }
        } catch (error) {
            alert("Fehler beim Ändern des Status: " + error.message);
        }
    }

    function createArea() { window.location.href = '/admin/learning-area-editor.html'; }
    function editArea(id) { window.location.href = `/admin/learning-area-editor.html?id=${id}`; }

    async function deleteArea(id, name) {
        if (!confirm(`"${name}" wirklich löschen?`)) return;
        try {
            const response = await window.auth.authFetch(`${API_BASE}/admin/learning-areas/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) loadAreas();
        } catch (error) {
            alert('Fehler beim Löschen');
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
