<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lernbereiche verwalten - RadBrain Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="navbar-content">
        <div class="nav-left">
            <img src="logo.png" alt="RadBrain" class="nav-logo">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/user-home.html" class="nav-link">Übersicht</a>
                </li>
                <li class="nav-item">
                    <a href="/admin-dashboard.html" class="nav-link">Admin</a>
                </li>
                <li class="nav-item">
                    <a href="/admin-learning-areas.html" class="nav-link active">Lernbereiche</a>
                </li>
            </ul>
        </div>
        <div class="nav-right" id="navRight"></div>
    </div>
</nav>

<!-- Main Content -->
<div class="container" style="padding-top: var(--space-12); padding-bottom: var(--space-16);">
    <!-- Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-12);">
        <div>
            <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: var(--space-2);">
                Lernbereiche
            </h1>
            <p style="color: var(--gray-600); font-size: 1.125rem;">
                Verwalte Lernbereiche, Module und Inhalte
            </p>
        </div>
        <button onclick="createArea()" class="btn btn-primary">
            + Neuer Lernbereich
        </button>
    </div>

    <!-- Learning Areas List -->
    <div id="areasList" style="display: grid; gap: var(--space-4);">
        <div style="text-align: center; padding: var(--space-12);">
            <div class="loading" style="width: 40px; height: 40px; margin: 0 auto;"></div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script src="dropdown.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api';

    // Check admin auth
    if (!window.auth || !window.auth.isLoggedIn()) {
        window.location.href = '/login.html';
    } else if (!window.auth.hasRole('ADMIN')) {
        window.location.href = '/user-home.html';
    } else {
        initializePage();
    }

    function initializePage() {
        const user = window.auth.getUser();
        const name = user.fullname ? user.fullname.split(' ')[0] : user.email.split('@')[0];

        document.getElementById('navRight').innerHTML = `
            <div class="nav-profile-dropdown">
                <button class="nav-profile-btn">
                    <span>${name}</span>
                    <span style="font-size: 0.75rem;">▾</span>
                </button>
                <div class="nav-profile-menu">
                    <a href="/account.html">Mein Account</a>
                    <div class="divider"></div>
                    <button onclick="window.auth.logout('/index.html')">Abmelden</button>
                </div>
            </div>
        `;

        loadAreas();
    }

    async function loadAreas() {
        try {
            const response = await window.auth.authFetch(`${API_BASE}/secure/admin/learning-areas`);
            if (!response.ok) throw new Error('Failed to load');

            const areas = await response.json();
            renderAreas(areas);
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('areasList').innerHTML = `
                <p style="text-align: center; color: var(--gray-600);">
                    Fehler beim Laden der Lernbereiche
                </p>
            `;
        }
    }

    function renderAreas(areas) {
        const container = document.getElementById('areasList');

        if (areas.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: var(--space-12);">
                    <p style="color: var(--gray-600); margin-bottom: var(--space-4);">
                        Noch keine Lernbereiche vorhanden
                    </p>
                    <button onclick="createArea()" class="btn btn-primary">
                        Ersten Lernbereich erstellen
                    </button>
                </div>
            `;
            return;
        }

        container.innerHTML = areas.sort((a, b) => a.displayOrder - b.displayOrder).map(area => `
            <div class="card">
                <div style="display: flex; justify-content: between; align-items: flex-start; gap: var(--space-6);">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2);">
                            <h3 style="font-size: 1.5rem; font-weight: 600; margin: 0;">
                                ${escapeHtml(area.name)}
                            </h3>
                            <span class="badge ${area.isPublished ? 'badge-success' : 'badge-warning'}">
                                ${area.isPublished ? 'Veröffentlicht' : 'Entwurf'}
                            </span>
                        </div>
                        ${area.subtitle ? `
                            <p style="color: var(--gray-700); margin-bottom: var(--space-2);">
                                ${escapeHtml(area.subtitle)}
                            </p>
                        ` : ''}
                        ${area.description ? `
                            <p style="color: var(--gray-600); font-size: 0.9375rem; margin-bottom: var(--space-4);">
                                ${escapeHtml(area.description)}
                            </p>
                        ` : ''}
                        <div style="display: flex; gap: var(--space-6); color: var(--gray-500); font-size: 0.9375rem;">
                            <span>Slug: ${area.slug}</span>
                            <span>${area.moduleCount || 0} Module</span>
                            <span>Position: ${area.displayOrder}</span>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: var(--space-2);">
                        <a href="/admin-modules.html?areaId=${area.id}" class="btn btn-sm btn-primary">
                            Module (${area.moduleCount || 0})
                        </a>
                        <button onclick="editArea(${area.id})" class="btn btn-sm btn-secondary">
                            Bearbeiten
                        </button>
                        <button onclick="togglePublish(${area.id}, ${!area.isPublished})" class="btn btn-sm btn-outline">
                            ${area.isPublished ? 'Verstecken' : 'Veröffentlichen'}
                        </button>
                        <button onclick="deleteArea(${area.id}, '${escapeHtml(area.name)}')" class="btn btn-sm" style="background: var(--error); color: white;">
                            Löschen
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function createArea() {
        window.location.href = '/learning-area-editor.html';
    }

    function editArea(id) {
        window.location.href = `/learning-area-editor.html?id=${id}`;
    }

    async function togglePublish(id, publish) {
        try {
            const response = await window.auth.authFetch(`${API_BASE}/secure/admin/learning-areas/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isPublished: publish })
            });

            if (response.ok) {
                loadAreas();
            } else {
                alert('Fehler beim Aktualisieren');
            }
        } catch {
            alert('Verbindungsfehler');
        }
    }

    async function deleteArea(id, name) {
        if (!confirm(`"${name}" wirklich löschen? Alle Module und Inhalte gehen verloren!`)) return;
        if (!confirm('Wirklich sicher? Diese Aktion kann nicht rückgängig gemacht werden!')) return;

        try {
            const response = await window.auth.authFetch(`${API_BASE}/secure/admin/learning-areas/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                loadAreas();
            } else {
                alert('Fehler beim Löschen');
            }
        } catch {
            alert('Verbindungsfehler');
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
