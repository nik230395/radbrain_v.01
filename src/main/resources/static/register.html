<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrierung - RadBrain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .register-container {
            min-height: 100vh;
            background:  linear-gradient(135deg, #645CBB 0%, #A084DC 50%, #BFACE2 100%);
        }
        .register-card {
            border-radius: 15px;
            border: none;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #645CBB, #A084DC);
            border: none;
            border-radius: 8px;
            padding: 12px;
        }
        .btn-primary-custom:hover {
            background:  linear-gradient(135deg, #5a52a5, #8f73c7);
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        . form-control:focus {
            border-color: #645CBB;
            box-shadow: 0 0 0 0.2rem rgba(100, 92, 187, 0.25);
        }
        .debug-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin-top:  20px;
            font-family: monospace;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="register-container d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card register-card shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <h1 class="h3 mb-3 fw-bold text-primary" style="color: #645CBB ! important;">🎯 RadBrain</h1>
                            <h2 class="h5 text-muted">Neue Registrierung</h2>
                        </div>

                        <form id="registerForm" onsubmit="handleRegister(event)">
                            <div class="mb-3">
                                <label for="fullname" class="form-label fw-semibold">Vollständiger Name</label>
                                <input type="text" class="form-control" id="fullname" name="fullname" required
                                       placeholder="Max Mustermann">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">E-Mail-Adresse</label>
                                <input type="email" class="form-control" id="email" name="email" required
                                       placeholder="max@spengergasse.at">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Passwort</label>
                                <input type="password" class="form-control" id="password" name="password" required
                                       placeholder="Mindestens 8 Zeichen" minlength="8">
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-semibold">Passwort bestätigen</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                                       placeholder="Passwort wiederholen">
                            </div>

                            <button type="submit" class="btn btn-primary-custom w-100 fw-semibold" id="registerBtn">
                                <span class="btn-text">Registrieren</span>
                                <span class="btn-loading d-none">
                                        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                        Wird verarbeitet...
                                    </span>
                            </button>
                        </form>

                        <div id="alertContainer" class="mt-3"></div>

                        <!-- ✅ Debug-Info Container -->
                        <div id="debugContainer" class="debug-info" style="display: none;">
                            <strong>🔍 Debug-Info:</strong><br>
                            <div id="debugContent"></div>
                        </div>

                        <!-- ✅ Test-Buttons -->
                        <div class="text-center mt-3">
                            <button type="button" class="btn btn-sm btn-outline-info me-2" onclick="testConnection()">
                                🔗 Verbindung testen
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="toggleDebug()">
                                🐛 Debug anzeigen
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <p class="mb-0">
                                Bereits ein Konto?
                                <a href="login.html" class="text-decoration-none fw-semibold" style="color: #645CBB;">
                                    Jetzt anmelden
                                </a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle. min.js"></script>

<script>
    // ✅ Debug-Funktionen
    function debugLog(message) {
        console.log('🐛 DEBUG:', message);
        const debugContent = document.getElementById('debugContent');
        if (debugContent) {
            debugContent.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
        }
    }

    function toggleDebug() {
        const debugContainer = document.getElementById('debugContainer');
        debugContainer.style. display = debugContainer.style.display === 'none' ? 'block' : 'none';
    }

    function showAlert(message, type = 'danger') {
        const alertContainer = document.getElementById('alertContainer');
        alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
    }

    function setLoading(loading) {
        const btn = document.getElementById('registerBtn');
        const btnText = btn.querySelector('.btn-text');
        const btnLoading = btn.querySelector('.btn-loading');

        if (loading) {
            btnText.classList.add('d-none');
            btnLoading.classList.remove('d-none');
            btn.disabled = true;
        } else {
            btnText.classList.remove('d-none');
            btnLoading.classList.add('d-none');
            btn.disabled = false;
        }
    }

    // ✅ Verbindungstest
    async function testConnection() {
        debugLog('🔗 Teste Verbindung...');
        showAlert('Teste Verbindung...', 'info');

        try {
            // Test 1: Server erreichbar?
            const serverResponse = await fetch(window.location.origin + '/');
            debugLog(`Server-Status: ${serverResponse.status}`);

            // Test 2: API erreichbar?
            const apiResponse = await fetch('/api/auth/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: 'test' })
            });
            debugLog(`API-Status: ${apiResponse.status}`);

            showAlert(`✅ Verbindung OK! Server: ${serverResponse.status}, API: ${apiResponse.status}`, 'success');

        } catch (error) {
            debugLog(`❌ Verbindungsfehler: ${error.message}`);
            showAlert(`❌ Verbindungsfehler: ${error.message}`, 'danger');
        }
    }

    // ✅ Erweiterte Registrierungsfunktion mit Debug
    async function handleRegister(event) {
        event.preventDefault();

        debugLog('🚀 Registrierung gestartet');

        // Form-Daten sammeln
        const fullname = document.getElementById('fullname').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document. getElementById('password').value;
        const confirmPassword = document. getElementById('confirmPassword').value;

        debugLog(`📝 Form-Daten: Name="${fullname}", Email="${email}", PassLength=${password.length}`);

        // Validation
        if (! fullname || !email || !password || !confirmPassword) {
            debugLog('❌ Validation:  Felder fehlen');
            showAlert('Bitte füllen Sie alle Felder aus.', 'warning');
            return;
        }

        if (password !== confirmPassword) {
            debugLog('❌ Validation:  Passwörter unterschiedlich');
            showAlert('Passwörter stimmen nicht überein.', 'warning');
            return;
        }

        if (password.length < 8) {
            debugLog('❌ Validation: Passwort zu kurz');
            showAlert('Passwort muss mindestens 8 Zeichen haben.', 'warning');
            return;
        }

        const requestData = {
            fullname: fullname,
            email: email,
            password: password
        };

        debugLog('📡 API-Request wird gesendet.. .');
        debugLog(`URL: ${window.location.origin}/api/users/register`);
        debugLog(`Daten: ${JSON.stringify(requestData, null, 2)}`);

        try {
            setLoading(true);

            const response = await fetch('/api/users/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body:  JSON.stringify(requestData)
            });

            debugLog(`📨 Response-Status: ${response.status} ${response.statusText}`);
            debugLog(`📨 Response-Headers: ${JSON.stringify([...response.headers. entries()])}`);

            let data;
            const contentType = response.headers.get('content-type');

            if (contentType && contentType.includes('application/json')) {
                data = await response. json();
                debugLog(`📨 Response-Data: ${JSON.stringify(data, null, 2)}`);
            } else {
                const text = await response.text();
                debugLog(`📨 Response-Text: ${text. substring(0, 500)}...`);
                data = { error: 'Server returned non-JSON response' };
            }

            if (response.ok) {
                debugLog('✅ Registrierung erfolgreich');

                localStorage.setItem('registrationEmail', email);
                localStorage.setItem('registrationName', fullname);

                showAlert('Registrierung erfolgreich! Sie werden zur Verifikation weitergeleitet... ', 'success');

                setTimeout(() => {
                    window.location.href = 'verify.html';
                }, 2000);

            } else {
                debugLog(`❌ Registrierung fehlgeschlagen: ${response.status}`);
                showAlert(data.error || `Server-Fehler (${response.status})`, 'danger');
            }
        } catch (error) {
            debugLog(`💥 Fetch-Error: ${error.name} - ${error.message}`);
            debugLog(`💥 Error-Stack: ${error.stack}`);

            if (error.name === 'TypeError' && error.message.includes('fetch')) {
                showAlert('❌ Server nicht erreichbar. Läuft der Server auf Port 8080?', 'danger');
            } else {
                showAlert(`Verbindungsfehler: ${error.message}`, 'danger');
            }
        } finally {
            setLoading(false);
        }
    }

    // Page initialization
    window.addEventListener('DOMContentLoaded', function() {
        debugLog('📄 Seite geladen');
        debugLog(`🌐 Current URL: ${window.location.href}`);
        debugLog(`🌐 Origin: ${window.location.origin}`);

        // URL-Parameter auslesen
        const urlParams = new URLSearchParams(window.location.search);
        const fullnameParam = urlParams.get('fullname');
        const emailParam = urlParams.get('email');

        if (fullnameParam) {
            document.getElementById('fullname').value = decodeURIComponent(fullnameParam);
            debugLog(`📝 Fullname aus URL gesetzt: ${fullnameParam}`);
        }
        if (emailParam) {
            document.getElementById('email').value = decodeURIComponent(emailParam);
            debugLog(`📝 Email aus URL gesetzt:  ${emailParam}`);
        }

        if (fullnameParam || emailParam) {
            window.history.replaceState({}, document.title, window.location.pathname);
            debugLog('🧹 URL bereinigt');
        }
    });
</script>
</body>
</html>
