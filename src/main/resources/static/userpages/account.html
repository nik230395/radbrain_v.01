<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Account - RadBrain</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <style>
    :root { --sidebar-width: 280px; }
    body { background-color: var(--gray-50); }
    .account-layout { display: grid; grid-template-columns: var(--sidebar-width) 1fr; gap: var(--space-8); align-items: start; }

    .account-nav {
      background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-xl);
      padding: var(--space-4); position: sticky; top: 100px;
    }
    .account-nav-item {
      display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4);
      color: var(--gray-600); text-decoration: none; border-radius: var(--radius-lg); transition: 0.2s; font-weight: 500;
    }
    .account-nav-item:hover { background: var(--gray-50); color: var(--primary); }
    .account-nav-item.active { background: var(--primary-light); color: var(--primary); }

    .profile-header {
      display: flex; align-items: center; gap: var(--space-6); margin-bottom: var(--space-10);
      padding: var(--space-6); background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-xl);
    }
    .profile-avatar {
      width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 2rem; font-weight: 700; box-shadow: var(--shadow-md);
    }

    .section-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-xl); overflow: hidden; margin-bottom: var(--space-8); }
    .section-header { padding: var(--space-6) var(--space-8); border-bottom: 1px solid var(--gray-100); }
    .section-body { padding: var(--space-8); }
    .section-footer { padding: var(--space-4) var(--space-8); background: var(--gray-50); display: flex; justify-content: flex-end; }

    .alert { padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 0.9rem; display: none; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    @media (max-width: 992px) { .account-layout { grid-template-columns: 1fr; } .account-nav { display: none; } }
  </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container" style="padding-top: 60px; padding-bottom: 80px;">
  <div class="account-layout">

    <aside class="account-nav">
      <a href="#profile" class="account-nav-item active">Profil</a>
      <a href="#security" class="account-nav-item">Sicherheit</a>
      <a href="#danger" class="account-nav-item" style="color: #ef4444;">Account löschen</a>
    </aside>

    <main>
      <header class="profile-header">
        <div class="profile-avatar" id="avatarCircle">?</div>
        <div>
          <h1 style="font-size: 1.875rem; font-weight: 700; margin: 0;" id="welcomeName">Lade Profil...</h1>
          <p style="color: var(--gray-500); margin-top: 5px;" id="userBadge">Mitglied</p>
        </div>
      </header>

      <section id="profile" class="section-card">
        <div class="section-header">
          <h2 style="font-size: 1.25rem; font-weight: 600;">Persönliche Informationen</h2>
        </div>
        <div class="section-body">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
              <label class="form-label">Vollständiger Name</label>
              <input type="text" id="fullname" class="form-input" placeholder="Vorname Nachname">
            </div>
            <div class="form-group">
              <label class="form-label">E-Mail-Adresse</label>
              <input type="email" id="email" class="form-input" disabled style="background: #f1f5f9; cursor: not-allowed;">
            </div>
          </div>
          <div id="accountMessage" class="alert"></div>
        </div>
        <div class="section-footer">
          <button onclick="updateProfile()" id="btnSaveProfile" class="btn btn-primary">Änderungen speichern</button>
        </div>
      </section>

      <section id="security" class="section-card">
        <div class="section-header">
          <h2 style="font-size: 1.25rem; font-weight: 600;">Passwort ändern</h2>
        </div>
        <div class="section-body">
          <div class="form-group">
            <label class="form-label">Aktuelles Passwort</label>
            <input type="password" id="currentPassword" class="form-input">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <div class="form-group">
              <label class="form-label">Neues Passwort</label>
              <input type="password" id="newPassword" class="form-input" placeholder="Mind. 8 Zeichen">
            </div>
            <div class="form-group">
              <label class="form-label">Bestätigen</label>
              <input type="password" id="confirmNewPassword" class="form-input">
            </div>
          </div>
          <div id="passwordMessage" class="alert"></div>
        </div>
        <div class="section-footer">
          <button onclick="changePassword()" class="btn btn-primary">Passwort aktualisieren</button>
        </div>
      </section>

      <section id="danger" class="section-card" style="border: 1px solid #fee2e2;">
        <div class="section-header" style="background: #fef2f2;">
          <h2 style="font-size: 1.25rem; font-weight: 600; color: #dc2626;">Gefahrenzone</h2>
        </div>
        <div class="section-body">
          <p>Das Löschen deines Accounts kann nicht rückgängig gemacht werden.</p>
        </div>
        <div class="section-footer">
          <button onclick="deleteAccount()" class="btn" style="background: #dc2626; color: white;">Account löschen</button>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
  const API_BASE = 'http://localhost:8080/api';

  document.addEventListener('DOMContentLoaded', () => {
    if (!window.auth || !window.auth.isLoggedIn()) {
      window.location.href = '/auth/login.html';
    } else {
      initializePage();
    }
  });

  async function initializePage() {
    // 1. Zuerst aktuelle Daten vom Server holen
    await fetchUserProfile();
    // 2. Navigation laden
    loadNavigationAreas();
  }

  async function fetchUserProfile() {
    try {
      const response = await window.auth.authFetch(`${API_BASE}/users/me`);

      if (!response.ok) {
        throw new Error("Server antwortet nicht korrekt");
      }

      const user = await response.json();

      // Anzeige aktualisieren
      const displayName = user.fullname || user.email.split('@')[0];
      document.getElementById('avatarCircle').textContent = displayName.charAt(0).toUpperCase();
      document.getElementById('welcomeName').textContent = user.fullname || 'Mein Account';
      document.getElementById('userBadge').textContent = (user.role === 'ADMIN' || user.roles?.includes('ADMIN')) ? 'Administrator' : 'RadBrain Mitglied';

      // Input Felder füllen
      document.getElementById('fullname').value = user.fullname || '';
      document.getElementById('email').value = user.email || '';

    } catch (e) {
      console.error("Profil-Ladefehler:", e);
      // Fallback: Daten aus dem Auth-Service nehmen, wenn der API-Call scheitert
      const fallbackUser = window.auth.getUser();
      if (fallbackUser) {
        document.getElementById('welcomeName').textContent = fallbackUser.fullname || 'Mein Account';
        document.getElementById('fullname').value = fallbackUser.fullname || '';
        document.getElementById('email').value = fallbackUser.email || '';
        document.getElementById('avatarCircle').textContent = (fallbackUser.fullname || "U").charAt(0).toUpperCase();
      } else {
        document.getElementById('welcomeName').textContent = "Fehler beim Laden";
      }
    }
  }

  async function updateProfile() {
    const fullname = document.getElementById('fullname').value.trim();
    const btn = document.getElementById('btnSaveProfile');

    if (!fullname) {
      showMessage('accountMessage', 'Bitte gib einen Namen ein.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Wird gespeichert...';

    try {
      const response = await window.auth.authFetch(`${API_BASE}/users/me`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullname })
      });

      if (response.ok) {
        showMessage('accountMessage', 'Profil erfolgreich aktualisiert!', 'success');
        await fetchUserProfile(); // Daten neu laden
      } else {
        showMessage('accountMessage', 'Fehler beim Speichern.', 'error');
      }
    } catch (e) {
      showMessage('accountMessage', 'Netzwerkfehler.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Änderungen speichern';
    }
  }

  async function changePassword() {
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmNewPassword = document.getElementById('confirmNewPassword').value;

    if (newPassword !== confirmNewPassword) {
      showMessage('passwordMessage', 'Passwörter stimmen nicht überein.', 'error');
      return;
    }

    try {
      const response = await window.auth.authFetch(`${API_BASE}/users/change-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword, newPassword })
      });

      if (response.ok) {
        showMessage('passwordMessage', 'Passwort wurde geändert!', 'success');
        document.querySelectorAll('#security input').forEach(i => i.value = '');
      } else {
        const err = await response.text();
        showMessage('passwordMessage', 'Fehler: ' + err, 'error');
      }
    } catch (e) { showMessage('passwordMessage', 'Serverfehler.', 'error'); }
  }

  function showMessage(id, msg, type) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alert alert-${type}`;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  async function loadNavigationAreas() {
    try {
      const res = await fetch(`${API_BASE}/learning-areas`);
      if (res.ok) {
        const areas = await res.json();
        const menu = document.getElementById('learningAreasMenu');
        if(menu) {
          menu.innerHTML = areas.map(a => `<li><a href="/lernbereiche/learning-area.html?area=${a.slug}">${a.name}</a></li>`).join('');
        }
      }
    } catch (e) {}
  }
</script>
</body>
</html>
