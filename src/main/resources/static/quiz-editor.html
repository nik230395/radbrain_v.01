<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUIZ EDITOR - RADBRAIN</title>
  <script src="auth.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #0a0e27;
      color: #00ff41;
      overflow-x: hidden;
    }

    #matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.15;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .back-nav {
      background: rgba(10, 14, 39, 0.9);
      border: 1px solid #00ff41;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
    }

    .back-button {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #00ccff;
      color: #00ccff;
      font-family: 'Share Tech Mono', monospace;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      font-size: 0.85em;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .back-button:hover {
      background: #00ccff;
      color: #000;
      box-shadow: 0 0 20px rgba(0, 204, 255, 0.5);
      transform: translateX(-5px);
    }

    .header {
      background: linear-gradient(135deg, #0f1729 0%, #1a1f3a 100%);
      border: 2px solid #00ff41;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00ff41, transparent);
      animation: scan 3s linear infinite;
    }

    @keyframes scan {
      to { left: 100%; }
    }

    .header-title {
      font-size: 2em;
      text-shadow: 0 0 10px #00ff41;
      letter-spacing: 2px;
    }

    .header-title::before {
      content: '> ';
      color: #ff0066;
    }

    .header-info {
      margin-top: 10px;
      color: #00ccff;
      font-size: 0.9em;
    }

    .terminal {
      background: #000;
      border: 2px solid #00ff41;
      margin-bottom: 30px;
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
    }

    .terminal-header {
      background: #0a0e27;
      padding: 10px 15px;
      border-bottom: 1px solid #00ff41;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .terminal-title {
      color: #00ff41;
      font-size: 0.9em;
      letter-spacing: 2px;
    }

    .terminal-controls {
      display: flex;
      gap: 8px;
    }

    .terminal-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .terminal-btn.close { background: #ff0066; box-shadow: 0 0 5px #ff0066; }
    .terminal-btn.minimize { background: #ffaa00; box-shadow: 0 0 5px #ffaa00; }
    .terminal-btn.maximize { background: #00ff41; box-shadow: 0 0 5px #00ff41; }

    .terminal-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      color: #00ccff;
      margin-bottom: 8px;
      font-size: 0.9em;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 12px;
      background: rgba(0, 255, 65, 0.05);
      border: 1px solid #00ff41;
      color: #00ff41;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9em;
      transition: all 0.3s;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      outline: none;
      background: rgba(0, 255, 65, 0.1);
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      padding: 12px 24px;
      border: 1px solid #00ff41;
      background: transparent;
      color: #00ff41;
      font-family: 'Share Tech Mono', monospace;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.85em;
    }

    .btn:hover:not(:disabled) {
      background: #00ff41;
      color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-danger {
      border-color: #ff0066;
      color: #ff0066;
    }

    .btn-danger:hover:not(:disabled) {
      background: #ff0066;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.5);
    }

    .btn-success {
      border-color: #00ff41;
      color: #000;
      background: #00ff41;
    }

    .btn-success:hover:not(:disabled) {
      background: #00ccff;
      border-color: #00ccff;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .question-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-card {
      background: rgba(10, 14, 39, 0.8);
      border: 1px solid #00ff41;
      padding: 16px;
      transition: all 0.3s;
    }

    .question-card:hover {
      border-color: #00ccff;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 255, 65, 0.3);
    }

    .question-number {
      color: #00ccff;
      font-size: 0.9em;
    }

    .question-actions {
      display: flex;
      gap: 8px;
    }

    .question-text {
      color: #00ff41;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 20px;
    }

    .choice-item {
      color: #00ccff;
      font-size: 0.85em;
    }

    .choice-item.correct {
      color: #00ff41;
      font-weight: bold;
    }

    .choice-item.correct::before {
      content: '✓ ';
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 3px;
      font-size: 0.75em;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .badge-published {
      background: rgba(0, 255, 65, 0.2);
      border: 1px solid #00ff41;
      color: #00ff41;
    }

    .badge-draft {
      background: rgba(255, 170, 0, 0.2);
      border: 1px solid #ffaa00;
      color: #ffaa00;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #00ccff;
      opacity: 0.6;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #00ff41;
      font-size: 1.2em;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #00ff41;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 16px;
      margin-bottom: 20px;
      border-left: 4px solid;
    }

    .alert-success {
      background: rgba(0, 255, 65, 0.1);
      border-color: #00ff41;
      color: #00ff41;
    }

    .alert-error {
      background: rgba(255, 0, 102, 0.1);
      border-color: #ff0066;
      color: #ff0066;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: #0a0e27;
      border: 2px solid #00ff41;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.5);
    }

    .modal-header {
      background: rgba(0, 255, 65, 0.1);
      padding: 16px 20px;
      border-bottom: 1px solid #00ff41;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      color: #00ff41;
      font-size: 1.2em;
      letter-spacing: 2px;
    }

    .modal-close {
      background: #ff0066;
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2em;
      transition: all 0.3s;
    }

    .modal-close:hover {
      background: #ff3388;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.5);
    }

    .modal-body {
      padding: 20px;
    }

    .choice-input-group {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .choice-input {
      flex: 1;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #00ccff;
      cursor: pointer;
      white-space: nowrap;
    }

    .checkbox-label input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .btn-remove-choice {
      padding: 8px 12px;
      font-size: 0.8em;
    }

    @media (max-width: 768px) {
      .btn-group {
        flex-direction: column;
      }
      .question-actions {
        flex-direction: column;
      }
      .choice-input-group {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
<canvas id="matrix-bg"></canvas>

<div class="container">
  <div class="back-nav">
    <a href="admin-dashboard.html" class="back-button">
      &lt;&lt; BACK TO ADMIN PANEL
    </a>
    <span style="color: #00ccff;" id="quizIdDisplay">[ LOADING... ]</span>
  </div>

  <div class="header">
    <h1 class="header-title" id="pageTitle">QUIZ EDITOR</h1>
    <div class="header-info" id="headerInfo">Initializing editor...</div>
  </div>

  <!-- Quiz Details -->
  <div class="terminal">
    <div class="terminal-header">
      <span class="terminal-title">QUIZ DETAILS</span>
      <div class="terminal-controls">
        <div class="terminal-btn minimize"></div>
        <div class="terminal-btn maximize"></div>
        <div class="terminal-btn close"></div>
      </div>
    </div>
    <div class="terminal-body">
      <div id="alertContainer"></div>

      <form id="quizForm">
        <div class="form-group">
          <label class="form-label">Quiz Title</label>
          <input type="text" class="form-input" id="quizTitle" required>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="quizDescription"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="quizCategory">
            <option value="">-- SELECT CATEGORY --</option>
            <option value="ROENTGEN">RÖNTGEN</option>
            <option value="CT">CT</option>
            <option value="MRT">MRT</option>
            <option value="ULTRASCHALL">ULTRASCHALL</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Status</label>
          <div style="display: flex; align-items: center; gap: 16px;">
            <span class="badge" id="statusBadge">DRAFT</span>
            <button type="button" class="btn" id="togglePublishBtn">TOGGLE PUBLISH</button>
          </div>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-success">SAVE CHANGES</button>
          <button type="button" class="btn" onclick="window.location.reload()">RESET</button>
          <button type="button" class="btn btn-danger" id="deleteQuizBtn">DELETE QUIZ</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Questions -->
  <div class="terminal">
    <div class="terminal-header">
      <span class="terminal-title">QUESTIONS MANAGEMENT</span>
      <div class="terminal-controls">
        <div class="terminal-btn minimize"></div>
        <div class="terminal-btn maximize"></div>
        <div class="terminal-btn close"></div>
      </div>
    </div>
    <div class="terminal-body">
      <div style="margin-bottom: 20px;">
        <button class="btn" onclick="openAddQuestionModal()">
          + ADD QUESTION
        </button>
      </div>

      <div id="questionsList">
        <div class="loading">LOADING QUESTIONS</div>
      </div>
    </div>
  </div>
</div>

<!-- Question Modal -->
<div class="modal-overlay" id="questionModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">ADD QUESTION</span>
      <button class="modal-close" onclick="closeQuestionModal()">×</button>
    </div>
    <div class="modal-body">
      <form id="questionForm">
        <div class="form-group">
          <label class="form-label">Question Text</label>
          <textarea class="form-textarea" id="questionText" required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Answer Choices</label>
          <div id="choicesContainer"></div>
          <button type="button" class="btn" onclick="addChoice()" style="margin-top: 12px;">
            + ADD CHOICE
          </button>
        </div>

        <div class="form-group">
          <label class="form-label">Explanation (Optional)</label>
          <textarea class="form-textarea" id="questionExplanation"></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-success">SAVE QUESTION</button>
          <button type="button" class="btn" onclick="closeQuestionModal()">CANCEL</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Matrix Background
  const canvas = document.getElementById('matrix-bg');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
  const fontSize = 14;
  const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);

  function drawMatrix() {
    ctx.fillStyle = 'rgba(10, 14, 39, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = matrix[Math.floor(Math.random() * matrix.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(drawMatrix, 50);

  // Auth Check
  if (!window.auth || !window.auth.isLoggedIn()) {
    window.location.href = 'login.html';
  }

  if (!window.auth.hasRole('ADMIN')) {
    alert('ACCESS DENIED - ADMIN PRIVILEGES REQUIRED');
    window.location.href = 'dashboard.html';
  }

  // Get Quiz ID
  const urlParams = new URLSearchParams(window.location.search);
  const quizId = urlParams.get('id');

  if (!quizId) {
    alert('NO QUIZ ID PROVIDED');
    window.location.href = 'admin-dashboard.html';
  }

  let currentQuiz = null;
  let questions = [];
  let currentEditingQuestion = null;
  let choices = [];

  // Initialize
  (async function() {
    await loadQuiz();
    await loadQuestions();
  })();

  async function loadQuiz() {
    try {
      // Use public endpoint: GET /api/quizzes/{id}
      const res = await window.auth.authFetch(`/api/quizzes/${quizId}`);
      if (!res.ok) throw new Error('Failed to load quiz');

      currentQuiz = await res.json();

      document.getElementById('quizIdDisplay').textContent = `[ QUIZ #${currentQuiz.id} ]`;
      document.getElementById('headerInfo').textContent = `Editing: ${currentQuiz.title}`;
      document.getElementById('quizTitle').value = currentQuiz.title || '';
      document.getElementById('quizDescription').value = currentQuiz.description || '';
      document.getElementById('quizCategory').value = currentQuiz.category || '';

      updateStatusBadge(currentQuiz.isPublished || currentQuiz.is_published);

    } catch (error) {
      console.error('Error:', error);
      showAlert('Failed to load quiz', 'error');
    }
  }

  async function loadQuestions() {
    const container = document.getElementById('questionsList');

    try {
      // Use: GET /api/questions/quiz/{quizId}
      const res = await window.auth.authFetch(`/api/questions/quiz/${quizId}`);
      if (!res.ok) throw new Error('Failed to load questions');

      questions = await res.json();

      if (questions.length === 0) {
        container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3em; margin-bottom: 16px;">[ EMPTY ]</div>
                        <p>NO QUESTIONS YET</p>
                        <p style="margin-top: 10px; opacity: 0.5;">Click "ADD QUESTION" to create one</p>
                    </div>
                `;
        return;
      }

      let html = '<div class="question-list">';

      questions.forEach((q, index) => {
        // Backend uses: text, auxText, choices
        html += `
                    <div class="question-card">
                        <div class="question-header">
                            <span class="question-number">QUESTION #${index + 1}</span>
                            <div class="question-actions">
                                <button class="btn" style="font-size: 0.8em; padding: 6px 12px;" onclick="openEditQuestionModal(${q.id})">EDIT</button>
                                <button class="btn btn-danger" style="font-size: 0.8em; padding: 6px 12px;" onclick="deleteQuestion(${q.id})">DELETE</button>
                            </div>
                        </div>
                        <div class="question-text">${q.text}</div>
                        <div class="choices-list">
                            ${(q.choices || []).map(c => `
                                <div class="choice-item ${c.isCorrect ? 'correct' : ''}">${c.text}</div>
                            `).join('')}
                        </div>
                        ${q.auxText ? `<div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0, 255, 65, 0.2); color: #ffaa00; font-size: 0.85em;">💡 ${q.auxText}</div>` : ''}
                    </div>
                `;
      });

      html += '</div>';
      container.innerHTML = html;

    } catch (error) {
      console.error('Error:', error);
      container.innerHTML = '<div style="color: #ff0066;">ERROR: FAILED TO LOAD QUESTIONS</div>';
    }
  }

  // Save Quiz Details
  document.getElementById('quizForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
      title: document.getElementById('quizTitle').value.trim(),
      description: document.getElementById('quizDescription').value.trim(),
      category: document.getElementById('quizCategory').value
    };

    if (!data.title) {
      showAlert('Title is required', 'error');
      return;
    }

    try {
      const res = await window.auth.authFetch(`/api/secure/admin/quizzes/${quizId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        showAlert('✅ QUIZ SAVED SUCCESSFULLY', 'success');
        await loadQuiz();
      } else {
        throw new Error('Save failed');
      }
    } catch (error) {
      showAlert('ERROR: FAILED TO SAVE', 'error');
    }
  });

  // Toggle Publish
  document.getElementById('togglePublishBtn').addEventListener('click', async () => {
    const isPublished = currentQuiz.isPublished || currentQuiz.is_published;
    const action = isPublished ? 'unpublish' : 'publish';

    try {
      const res = await window.auth.authFetch(`/api/secure/admin/quizzes/${quizId}/${action}`, {
        method: 'POST'
      });

      if (res.ok) {
        await loadQuiz();
        showAlert(`✅ QUIZ ${action.toUpperCase()}ED`, 'success');
      }
    } catch (error) {
      showAlert('ERROR: FAILED TO CHANGE STATUS', 'error');
    }
  });

  // Delete Quiz
  document.getElementById('deleteQuizBtn').addEventListener('click', async () => {
    if (!confirm('DELETE THIS QUIZ?\n\nTHIS CANNOT BE UNDONE!\n\nAll questions will be deleted!')) {
      return;
    }

    try {
      const res = await window.auth.authFetch(`/api/secure/admin/quizzes/${quizId}`, {
        method: 'DELETE'
      });

      if (res.ok) {
        alert('✅ QUIZ DELETED');
        window.location.href = 'admin-dashboard.html';
      } else {
        throw new Error('Delete failed');
      }
    } catch (error) {
      showAlert('ERROR: FAILED TO DELETE', 'error');
    }
  });

  // MODAL FUNCTIONS

  function openAddQuestionModal() {
    currentEditingQuestion = null;
    choices = [];

    document.getElementById('modalTitle').textContent = 'ADD QUESTION';
    document.getElementById('questionText').value = '';
    document.getElementById('questionExplanation').value = '';

    // Add 4 default choices
    document.getElementById('choicesContainer').innerHTML = '';
    for (let i = 0; i < 4; i++) {
      addChoice();
    }

    document.getElementById('questionModal').classList.add('show');
  }

  async function openEditQuestionModal(questionId) {
    try {
      // GET /api/questions/{id}
      const res = await window.auth.authFetch(`/api/questions/${questionId}`);
      if (!res.ok) throw new Error('Failed to load question');

      currentEditingQuestion = await res.json();
      choices = [];

      document.getElementById('modalTitle').textContent = 'EDIT QUESTION';
      document.getElementById('questionText').value = currentEditingQuestion.text;
      document.getElementById('questionExplanation').value = currentEditingQuestion.auxText || '';

      // Load existing choices
      document.getElementById('choicesContainer').innerHTML = '';
      (currentEditingQuestion.choices || []).forEach(choice => {
        addChoice(choice.text, choice.isCorrect);
      });

      document.getElementById('questionModal').classList.add('show');

    } catch (error) {
      showAlert('ERROR: FAILED TO LOAD QUESTION', 'error');
    }
  }

  function closeQuestionModal() {
    document.getElementById('questionModal').classList.remove('show');
    document.getElementById('questionForm').reset();
    choices = [];
    currentEditingQuestion = null;
  }

  let choiceCounter = 0;

  function addChoice(text = '', isCorrect = false) {
    const id = `choice_${choiceCounter++}`;
    const container = document.getElementById('choicesContainer');

    const div = document.createElement('div');
    div.className = 'choice-input-group';
    div.id = `container_${id}`;
    div.innerHTML = `
            <input type="text" class="form-input choice-input" id="${id}" value="${text}" placeholder="Enter choice text" required>
            <label class="checkbox-label">
                <input type="checkbox" id="${id}_correct" ${isCorrect ? 'checked' : ''}>
                CORRECT
            </label>
            <button type="button" class="btn btn-danger btn-remove-choice" onclick="removeChoice('${id}')">×</button>
        `;

    container.appendChild(div);
    choices.push(id);
  }

  function removeChoice(id) {
    if (choices.length <= 2) {
      alert('Minimum 2 choices required!');
      return;
    }

    document.getElementById(`container_${id}`).remove();
    choices = choices.filter(c => c !== id);
  }

  // Save Question - THIS IS THE TRICKY PART!
  // Backend expects: POST /api/questions with {quizId, qtype, text, auxText}
  // Then separately we need to create choices
  document.getElementById('questionForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const questionText = document.getElementById('questionText').value.trim();
    const explanation = document.getElementById('questionExplanation').value.trim();

    if (!questionText) {
      alert('Question text is required!');
      return;
    }

    // Collect choices
    const choicesData = [];
    let hasCorrect = false;

    for (const choiceId of choices) {
      const text = document.getElementById(choiceId).value.trim();
      const isCorrect = document.getElementById(`${choiceId}_correct`).checked;

      if (!text) {
        alert('All choices must have text!');
        return;
      }

      if (isCorrect) hasCorrect = true;

      choicesData.push({
        text: text,
        isCorrect: isCorrect
      });
    }

    if (!hasCorrect) {
      alert('At least one choice must be marked as correct!');
      return;
    }

    try {
      if (currentEditingQuestion) {
        // UPDATE: PUT /api/questions/{id} with {text, auxText}
        const res = await window.auth.authFetch(`/api/questions/${currentEditingQuestion.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: questionText,
            auxText: explanation || null
          })
        });

        if (res.ok) {
          // TODO: Update choices via Choice API
          showAlert('✅ QUESTION UPDATED (Note: Choices editing not fully implemented)', 'success');
          closeQuestionModal();
          await loadQuestions();
        } else {
          throw new Error('Update failed');
        }
      } else {
        // CREATE: POST /api/questions with {quizId, qtype, text, auxText}
        const res = await window.auth.authFetch(`/api/questions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            quizId: parseInt(quizId),
            qtype: 'MULTIPLE_CHOICE',  // Assuming this type
            text: questionText,
            auxText: explanation || null
          })
        });

        if (res.ok) {
          const createdQuestion = await res.json();

          // Now create choices for this question
          // POST /api/choices (need to check if this endpoint exists)
          // For now, show success and reload
          showAlert('✅ QUESTION CREATED (Note: Choices need to be added via choice API)', 'success');
          closeQuestionModal();
          await loadQuestions();
        } else {
          throw new Error('Create failed');
        }
      }
    } catch (error) {
      console.error('Error:', error);
      alert('ERROR: ' + error.message);
    }
  });

  async function deleteQuestion(id) {
    if (!confirm('DELETE THIS QUESTION?\n\nThis cannot be undone!')) {
      return;
    }

    try {
      // DELETE /api/questions/{id}
      const res = await window.auth.authFetch(`/api/questions/${id}`, {
        method: 'DELETE'
      });

      if (res.ok) {
        showAlert('✅ QUESTION DELETED', 'success');
        await loadQuestions();
      } else {
        throw new Error('Delete failed');
      }
    } catch (error) {
      showAlert('ERROR: FAILED TO DELETE QUESTION', 'error');
    }
  }

  function updateStatusBadge(isPublished) {
    const badge = document.getElementById('statusBadge');
    if (isPublished) {
      badge.className = 'badge badge-published';
      badge.textContent = 'PUBLISHED';
    } else {
      badge.className = 'badge badge-draft';
      badge.textContent = 'DRAFT';
    }
  }

  function showAlert(message, type) {
    const container = document.getElementById('alertContainer');
    container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    setTimeout(() => {
      container.innerHTML = '';
    }, 5000);
  }

  // Close modal on overlay click
  document.getElementById('questionModal').addEventListener('click', (e) => {
    if (e.target.id === 'questionModal') {
      closeQuestionModal();
    }
  });
</script>
</body>
</html>
