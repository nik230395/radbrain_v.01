<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Lernbereich - RadBrain</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/dropdown.js"></script>
    <style>
        .learning-header { background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%); color: white; padding: var(--space-16) 0; position: relative; }
        .breadcrumb { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); font-size: 0.9375rem; }
        .breadcrumb a { color: rgba(255,255,255,0.8); transition: color var(--transition-fast); }
        .breadcrumb a:hover { color: white; }
        .breadcrumb span { color: rgba(255,255,255,0.5); }
        .module-list { display: grid; gap: var(--space-4); }
        .module-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-6); transition: all var(--transition-base); cursor: pointer; }
        .module-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .module-header { display: flex; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-4); }
        .module-number { flex-shrink: 0; width: 40px; height: 40px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .module-content { flex: 1; }
        .module-title { font-size: 1.25rem; font-weight: 600; color: var(--gray-900); margin-bottom: var(--space-2); }
        .module-description { color: var(--gray-600); line-height: 1.6; margin-bottom: var(--space-3); }
        .module-meta { display: flex; gap: var(--space-6); color: var(--gray-500); font-size: 0.875rem; }
        .content-viewer { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-8); }

        /* Sidebar Styling */
        .sidebar { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
        .sidebar-nav { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-4); }
        .sidebar-title { font-size: 0.875rem; font-weight: 600; color: var(--gray-500); text-transform: uppercase; margin-bottom: var(--space-4); }
        .sidebar-list { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }
        .sidebar-list a { display: block; padding: var(--space-2) var(--space-3); color: var(--gray-700); border-radius: var(--radius-md); text-decoration: none; transition: 0.2s; }
        .sidebar-list a:hover { background: var(--gray-50); color: var(--primary); }
        .sidebar-list a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }

        /* NEUE KREATIVE KLASSEN FÜR INHALTE */
        .content-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin: 2rem 0; }
        .content-info-card {
            background: #ffffff; border: 1px solid #e2e8f0; border-left: 5px solid var(--primary);
            padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .content-info-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-color: var(--primary); }
        .content-info-card::before { content: "💡"; position: absolute; right: 10px; top: 10px; opacity: 0.2; font-size: 1.5rem; }
        .content-text-block { margin-bottom: 1.5rem; line-height: 1.8; color: #334155; font-size: 1.05rem; }

        /* Warning Box für Texte die mit "!" beginnen */
        .warning-box {
            background: #fff7ed; border: 1px solid #fed7aa; border-left: 5px solid #f97316;
            padding: 1.25rem; border-radius: 8px; margin: 1.5rem 0; color: #9a3412; font-weight: 500;
        }

        /* Navbar Profile Dropdown */
        .nav-profile-dropdown { position: relative; }
        .nav-profile-btn { background: none; border: 1px solid var(--gray-200); padding: 8px 16px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .nav-profile-menu { display: none; position: absolute; right: 0; top: 110%; background: white; border: 1px solid var(--gray-200); border-radius: 8px; min-width: 200px; box-shadow: var(--shadow-lg); z-index: 100; }
        .nav-profile-dropdown.active .nav-profile-menu { display: block; }
        .nav-profile-menu a, .nav-profile-menu button { display: block; width: 100%; padding: 10px 15px; text-decoration: none; color: var(--gray-700); text-align: left; background: none; border: none; cursor: pointer; }
        .nav-profile-menu a:hover { background: var(--gray-50); }
        .divider { height: 1px; background: var(--gray-200); margin: 5px 0; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-content">
        <div class="nav-left">
            <img src="/Bilder/logo.png" alt="RadBrain" class="nav-logo">
            <ul class="nav-menu">
                <li class="nav-item"><a href="/userpages/user-home.html" class="nav-link">Übersicht</a></li>
                <li class="nav-item dropdown">
                    <a href="#" class="nav-link">Lernbereiche</a>
                    <ul class="dropdown-menu" id="learningAreasMenu"></ul>
                </li>
                <li class="nav-item"><a href="/quiz/quizzes.html" class="nav-link">Quizzes</a></li>
            </ul>
        </div>
        <div class="nav-right" id="navRight">
            <a href="/auth/login.html" class="btn-login">Anmelden</a>
        </div>
    </div>
</nav>

<div id="loadingState" style="padding: 100px; text-align: center;">Lade Lernbereich...</div>
<div id="errorState" style="display: none; padding: 100px; text-align: center;">Bereich nicht gefunden.</div>

<div id="mainContent" style="display: none;">
    <header class="learning-header">
        <div class="container">
            <div class="breadcrumb"><a href="/userpages/user-home.html">Home</a><span>›</span><span id="areaNameBreadcrumb"></span></div>
            <h1 id="areaTitle"></h1>
            <p id="areaSubtitle"></p>
        </div>
    </header>

    <div class="container" style="padding: 40px 0;">
        <div style="display: grid; grid-template-columns: 280px 1fr; gap: 40px;">
            <aside class="sidebar">
                <div class="sidebar-nav">
                    <div class="sidebar-title">Module</div>
                    <ul class="sidebar-list" id="sidebarModuleList"></ul>
                </div>
            </aside>
            <main>
                <div id="modulesOverview">
                    <h2 style="margin-bottom: 30px;">Module in diesem Bereich</h2>
                    <div class="module-list" id="modulesList"></div>
                </div>
                <div id="moduleContentView" style="display: none;">
                    <button onclick="showModulesOverview()" class="btn btn-ghost" style="margin-bottom: 20px;">← Zurück</button>
                    <div class="content-viewer" id="contentViewer"></div>
                </div>
            </main>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api';
    let currentArea = null;
    let currentModules = [];
    const urlParams = new URLSearchParams(window.location.search);
    const areaSlug = urlParams.get('area');

    // NAVBAR AUTH LOGIK
    function updateNavbar() {
        const navRight = document.getElementById('navRight');
        if (window.auth && window.auth.isLoggedIn()) {
            const user = window.auth.getUser();
            const name = user.fullname ? user.fullname.split(' ')[0] : "User";
            navRight.innerHTML = `
                <div class="nav-profile-dropdown" id="profileDropdown">
                    <button class="nav-profile-btn" onclick="toggleDropdown()">
                        <span>${name}</span><span>▾</span>
                    </button>
                    <div class="nav-profile-menu">
                        <a href="/userpages/account.html">Mein Account</a>
                        <a href="/userpages/dashboard.html">Dashboard</a>
                        <div class="divider"></div>
                        <button onclick="window.auth.logout('/index.html')" style="color:red;">Abmelden</button>
                    </div>
                </div>`;
        }
    }

    function toggleDropdown() {
        document.getElementById('profileDropdown').classList.toggle('active');
    }

    // CONTENT LOGIK
    async function loadLearningArea() {
        if (!areaSlug) { showError(); return; }
        try {
            const response = await fetch(`${API_BASE}/learning-areas/${areaSlug}`);
            currentArea = await response.json();
            currentModules = currentArea.modules || [];
            await Promise.all(currentModules.map(loadModuleContent));
            renderPage();
            updateNavbar();

            const targetId = urlParams.get('moduleId');
            if (targetId) showModuleContent(parseInt(targetId));
        } catch (e) { showError(); }
    }

    async function loadModuleContent(module) {
        const res = await fetch(`${API_BASE}/learning-areas/modules/${module.id}`);
        if (res.ok) {
            const data = await res.json();
            module.contents = data.contents || [];
        }
    }

    function renderPage() {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('areaTitle').textContent = currentArea.name;
        document.getElementById('areaNameBreadcrumb').textContent = currentArea.name;
        document.getElementById('areaSubtitle').textContent = currentArea.subtitle || '';
        renderModulesList();
        renderSidebarModules();
    }

    function renderModulesList() {
        document.getElementById('modulesList').innerHTML = currentModules.map((m, i) => `
            <div class="module-card" onclick="showModuleContent(${m.id})">
                <div class="module-header">
                    <div class="module-number">${i+1}</div>
                    <div class="module-content">
                        <div class="module-title">${escapeHtml(m.title)}</div>
                        <div class="module-meta"><span>${m.contents.length} Lerneinheiten</span></div>
                    </div>
                </div>
            </div>`).join('');
    }

    function renderSidebarModules() {
        document.getElementById('sidebarModuleList').innerHTML = currentModules.map(m => `
            <li><a href="#" onclick="event.preventDefault(); showModuleContent(${m.id});" data-module-id="${m.id}">${escapeHtml(m.title)}</a></li>
        `).join('');
    }

    function showModuleContent(moduleId) {
        const module = currentModules.find(m => m.id === moduleId);
        if (!module) return;

        document.getElementById('modulesOverview').style.display = 'none';
        document.getElementById('moduleContentView').style.display = 'block';

        // Sidebar aktiv setzen
        document.querySelectorAll('.sidebar-list a').forEach(a => a.classList.toggle('active', a.dataset.moduleId == moduleId));

        const viewer = document.getElementById('contentViewer');
        let html = `<h2>${escapeHtml(module.title)}</h2>`;
        if (module.subtitle) html += `<p style="color:var(--gray-500); margin-bottom:2rem;">${escapeHtml(module.subtitle)}</p>`;

        html += (module.contents || []).sort((a,b) => a.displayOrder - b.displayOrder).map(c => {
            const data = c.contentData.trim();

            // KREATIVER PARSER
            if (data.startsWith('[') && data.endsWith(']')) {
                try {
                    const items = JSON.parse(data);
                    return `<div class="content-card-grid">${items.map(item => `
                        <div class="content-info-card"><strong>Fokus:</strong><br>${escapeHtml(item)}</div>`).join('')}</div>`;
                } catch(e) { return `<p class="content-text-block">${escapeHtml(data)}</p>`; }
            }

            if (data.startsWith('!')) {
                return `<div class="warning-box"><strong>Wichtig:</strong> ${escapeHtml(data.substring(1))}</div>`;
            }

            return `<p class="content-text-block">${escapeHtml(data)}</p>`;
        }).join('');

        viewer.innerHTML = html;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showModulesOverview() {
        document.getElementById('modulesOverview').style.display = 'block';
        document.getElementById('moduleContentView').style.display = 'none';
        document.querySelectorAll('.sidebar-list a').forEach(a => a.classList.remove('active'));
    }

    function showError() {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
    }

    function escapeHtml(t) {
        const d = document.createElement('div'); d.textContent = t; return d.innerHTML;
    }

    async function loadNavigationAreas() {
        const res = await fetch(`${API_BASE}/learning-areas`);
        if (res.ok) {
            const areas = await res.json();
            document.getElementById('learningAreasMenu').innerHTML = areas.map(a =>
                `<li><a href="/lernbereiche/learning-area.html?area=${a.slug}">${escapeHtml(a.name)}</a></li>`).join('');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadLearningArea();
        loadNavigationAreas();
    });
</script>
</body>
</html>
