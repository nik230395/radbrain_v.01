<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inhaltsverzeichnis - RadBrain</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <style>
    .search-bar { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-6); margin-bottom: var(--space-8); }
    .search-input-wrapper { position: relative; margin-bottom: var(--space-4); }
    .search-input { padding-left: var(--space-10); width: 100%; height: 45px; border: 1px solid #ddd; border-radius: 8px; }
    .filter-tags { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: 15px; }
    .filter-tag { padding: var(--space-2) var(--space-4); background: white; border: 1px solid var(--gray-300); border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; }
    .filter-tag.active { background: var(--primary); border-color: var(--primary); color: white; }
    .toc-tree { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); overflow: hidden; }
    .toc-area { border-bottom: 1px solid var(--gray-200); }
    .toc-area-header { padding: var(--space-6); background: var(--gray-50); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .toc-area-title { font-size: 1.25rem; font-weight: 600; }
    .toggle-icon { transition: transform 0.3s; color: var(--gray-400); }
    .toc-area.expanded .toggle-icon { transform: rotate(180deg); }
    .toc-modules { display: none; padding: 0 var(--space-6) var(--space-6) var(--space-6); }
    .toc-area.expanded .toc-modules { display: block; }
    .toc-module { padding: var(--space-4); border: 1px solid var(--gray-200); border-radius: var(--radius-md); margin-bottom: var(--space-3); cursor: pointer; transition: all 0.2s; }
    .toc-module:hover { border-color: var(--primary); background: var(--primary-light); }
    .toc-module-header { display: flex; align-items: center; }
    .toc-module-number { flex-shrink: 0; width: 32px; height: 32px; background: var(--gray-100); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; margin-right: 15px; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; border: 1px solid var(--gray-200); border-radius: 12px; padding: 20px; text-align: center; }
    .stat-value { font-size: 2.5rem; font-weight: 700; color: var(--primary); }
  </style>
</head>
<body>



<div class="container" style="padding: 40px 20px;">
  <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 10px;">Inhaltsverzeichnis</h1>
  <p style="color: #64748b; font-size: 1.1rem; margin-bottom: 40px;">Übersicht aller Lernbereiche und Module</p>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-value" id="totalAreas">0</div><div>Bereiche</div></div>
    <div class="stat-card"><div class="stat-value" id="totalModules">0</div><div>Module</div></div>
    <div class="stat-card"><div class="stat-value" id="totalContents">0</div><div>Inhalte</div></div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Nach Themen oder Modulen suchen..." onkeyup="renderContent()">
    <div id="filterButtons" class="filter-tags">
      <button class="filter-tag active" onclick="filterByArea(event, 'ALL')">Alle Bereiche</button>
    </div>
  </div>

  <div id="tocContainer">
    <div style="text-align: center; padding: 50px;">Lade Lerninhalte...</div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
  const API_BASE = 'http://localhost:8080/api';
  let allAreas = [];
  let currentFilter = 'ALL';

  async function loadAllContent() {
    try {
      const response = await fetch(`${API_BASE}/learning-areas`);
      if (!response.ok) throw new Error("Fehler beim Laden");
      const baseAreas = await response.json();

      // Wir laden die Details für jeden Bereich nacheinander
      const detailedAreas = [];
      for (const area of baseAreas) {
        const res = await fetch(`${API_BASE}/learning-areas/${area.slug}`);
        if (res.ok) {
          const fullData = await res.json();
          detailedAreas.push(fullData);
        } else {
          detailedAreas.push({ ...area, modules: [] });
        }
      }

      allAreas = detailedAreas;
      renderFilterButtons();
      renderContent();
      updateStats();
    } catch (e) {
      console.error("Fehler:", e);
      document.getElementById('tocContainer').innerHTML = "Fehler beim Laden der Lernbereiche. Bitte Backend prüfen.";
    }
  }

  function renderFilterButtons() {
    const container = document.getElementById('filterButtons');
    // Bestehende Buttons außer "Alle" entfernen, um Duplikate zu vermeiden
    const allBtn = container.querySelector('.filter-tag');
    container.innerHTML = '';
    container.appendChild(allBtn);

    allAreas.forEach(area => {
      const btn = document.createElement('button');
      btn.className = 'filter-tag';
      btn.innerText = area.name;
      btn.onclick = (e) => filterByArea(e, area.slug);
      container.appendChild(btn);
    });
  }

  function renderContent() {
    const container = document.getElementById('tocContainer');
    const search = document.getElementById('searchInput').value.toLowerCase();

    let filtered = allAreas;
    if (currentFilter !== 'ALL') {
      filtered = allAreas.filter(a => a.slug === currentFilter);
    }

    if (filtered.length === 0) {
      container.innerHTML = "<p>Keine Lernbereiche gefunden.</p>";
      return;
    }

    container.innerHTML = `<div class="toc-tree">` + filtered.map(area => {
      const modules = area.modules || [];
      const filteredModules = modules.filter(m => m.title.toLowerCase().includes(search));

      return `
        <div class="toc-area expanded" id="area-${area.id}">
          <div class="toc-area-header" onclick="toggleArea(${area.id})">
            <div>
              <div class="toc-area-title">${area.name}</div>
              <div class="toc-area-meta"><span>${modules.length} Module</span></div>
            </div>
            <span class="toggle-icon">▼</span>
          </div>
          <div class="toc-modules">
            ${filteredModules.map((m, i) => `
              <div class="toc-module" onclick="openModule('${area.slug}', ${m.id})">
                <div class="toc-module-header">
                  <div class="toc-module-number">${i+1}</div>
                  <div>
                    <div class="toc-module-title"><strong>${m.title}</strong></div>
                    <div style="color: #64748b; font-size: 0.85rem;">${m.subtitle || ''}</div>
                  </div>
                </div>
              </div>
            `).join('')}
            ${filteredModules.length === 0 ? '<p style="padding:10px; color:#999;">Keine passenden Module gefunden.</p>' : ''}
          </div>
        </div>
      `;
    }).join('') + `</div>`;
  }

  function openModule(areaSlug, moduleId) {
    window.location.href = `/lernbereiche/learning-area.html?area=${areaSlug}&moduleId=${moduleId}`;
  }

  function toggleArea(id) {
    const el = document.getElementById(`area-${id}`);
    if (el) el.classList.toggle('expanded');
  }

  function filterByArea(event, slug) {
    currentFilter = slug;
    document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderContent();
  }

  function updateStats() {
    const totalModules = allAreas.reduce((s, a) => s + (a.modules ? a.modules.length : 0), 0);
    document.getElementById('totalAreas').innerText = allAreas.length;
    document.getElementById('totalModules').innerText = totalModules;
  }

  // Start
  loadAllContent();
</script>
</body>
</html>
