<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dein Profil - RadBrain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="main.js"></script>
</head>
<body>
<nav class="navbar">
    <div class="nav-left">
        <img src="Bilder/logo.png" alt="RadBrain Logo" style="height: 35px;" />
        <span class="logo-text" style="font-size: 1.4rem; font-weight: bold;">RadBrain</span>
    </div>
    <ul class="nav-menu">
        <li class="nav-item"><a href="quiz.html" class="nav-link">Quiz</a></li>
        <li class="nav-item" id="adminNavItem" style="display: none;"><a href="admin-dashboard.html" class="nav-link">Admin Panel</a></li>
        <li class="nav-item"><a href="index.html" id="logoutBtn" class="nav-link">Logout</a></li>
    </ul>
</nav>
<section class="dashboard">
    <div class="container">
        <h1>Dein Profil</h1>
        <div id="profile"></div>
        <h2>Deine Quiz-Versuche</h2>
        <div id="attempts"></div>
    </div>
</section>
<footer class="footer"></footer>
<script>
    // Check if user is admin and show admin panel link
    if (window.auth && window.auth.isLoggedIn()) {
        const user = window.auth.getUser();
        if (window.auth.hasRole('ADMIN')) {
            document.getElementById('adminNavItem').style.display = 'block';
        }
    }
</script>
</body>
</html>
