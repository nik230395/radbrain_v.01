<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - RadBrain</title>
    <script src="/auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: white;
            transform: translateY(-2px);
        }

        .quiz-header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .quiz-title {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }

        .quiz-description {
            color: #666;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }

        .progress-text {
            color: #999;
            font-size: 0.9em;
        }

        .question-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .question-number {
            color: #667eea;
            font-weight: 700;
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice {
            padding: 18px 24px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .choice:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .choice.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .choice-radio {
            width: 20px;
            height: 20px;
            border: 2px solid #667eea;
            border-radius: 50%;
            position: relative;
        }

        .choice.selected .choice-radio::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: #667eea;
            border-radius: 50%;
        }

        .choice-text {
            flex: 1;
            color: #333;
            font-size: 1.05em;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-prev {
            background: #f5f5f5;
            color: #666;
        }

        .btn-prev:hover {
            background: #e0e0e0;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .score-display {
            font-size: 4em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .results-message {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
        }

        .results-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .result-stat {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .result-stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .result-stat-label {
            color: #666;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .results-details {
                grid-template-columns: 1fr;
            }
            .nav-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <a href="/quizzes.html" class="back-link">← Zurück zur Übersicht</a>

    <div id="quizContent">
        <div class="loading">Quiz wird geladen...</div>
    </div>
</div>

<script>
    let quiz = null;
    let questions = [];
    let currentQuestionIndex = 0;
    let answers = {};
    let quizId = null;

    (async function() {
        if (!window.auth || !window.auth.isLoggedIn()) {
            window.location.href = '/login.html';
            return;
        }

        const params = new URLSearchParams(window.location.search);
        quizId = params.get('id');

        if (!quizId) {
            alert('Keine Quiz-ID angegeben!');
            window.location.href = '/quizzes.html';
            return;
        }

        await loadQuiz();
    })();

    async function loadQuiz() {
        try {
            const res = await window.auth.authFetch(`/api/quizzes/${quizId}`);
            if (!res.ok) throw new Error('Quiz not found');

            quiz = await res.json();
            questions = quiz.questions || [];

            if (questions.length === 0) {
                document.getElementById('quizContent').innerHTML = `
                        <div class="results-card">
                            <h2>Keine Fragen gefunden</h2>
                            <p>Dieses Quiz enthält noch keine Fragen.</p>
                        </div>
                    `;
                return;
            }

            showQuestion();

        } catch (error) {
            console.error('Error loading quiz:', error);
            document.getElementById('quizContent').innerHTML = `
                    <div class="results-card">
                        <h2>❌ Fehler</h2>
                        <p>Quiz konnte nicht geladen werden.</p>
                    </div>
                `;
        }
    }

    function showQuestion() {
        const question = questions[currentQuestionIndex];
        const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
        const isMultiple = question.qtype === 'MULTIPLE';

        let html = `
                <div class="quiz-header">
                    <h1 class="quiz-title">${quiz.title}</h1>
                    <p class="quiz-description">${quiz.description || ''}</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                    <p class="progress-text">Frage ${currentQuestionIndex + 1} von ${questions.length}</p>
                </div>

                <div class="question-card">
                    <div class="question-number">FRAGE ${currentQuestionIndex + 1}</div>
                    <div class="question-text">${question.text}</div>
                    ${isMultiple ? '<p style="color: #667eea; font-size: 0.9em; margin-bottom: 15px;">⚠️ Mehrfachauswahl möglich</p>' : ''}

                    <div class="choices">
            `;

        if (question.choices && question.choices.length > 0) {
            question.choices.forEach((choice, index) => {
                const userAnswer = answers[question.id];
                let isSelected = false;

                if (isMultiple) {
                    // Multiple: userAnswer ist Array
                    isSelected = userAnswer && userAnswer.includes(choice.id);
                } else {
                    // Single: userAnswer ist einzelne ID
                    isSelected = userAnswer === choice.id;
                }

                html += `
                        <div class="choice ${isSelected ? 'selected' : ''}" onclick="selectAnswer(${question.id}, ${choice.id}, ${isMultiple})">
                            <div class="choice-radio"></div>
                            <div class="choice-text">${choice.text}</div>
                        </div>
                    `;
            });
        }

        html += `
                    </div>
                </div>

                <div class="nav-buttons">
                    ${currentQuestionIndex > 0 ? '<button class="btn btn-prev" onclick="previousQuestion()">← Zurück</button>' : '<div></div>'}
                    ${currentQuestionIndex < questions.length - 1
            ? '<button class="btn btn-next" onclick="nextQuestion()">Weiter →</button>'
            : '<button class="btn btn-next" onclick="submitQuiz()">Quiz abschließen ✓</button>'
        }
                </div>
            `;

        document.getElementById('quizContent').innerHTML = html;
    }

    function selectAnswer(questionId, choiceId, isMultiple) {
        if (isMultiple) {
            // Multiple Choice: Array von IDs
            if (!answers[questionId]) {
                answers[questionId] = [];
            }

            const index = answers[questionId].indexOf(choiceId);
            if (index > -1) {
                // Already selected, remove it
                answers[questionId].splice(index, 1);
            } else {
                // Not selected, add it
                answers[questionId].push(choiceId);
            }
        } else {
            // Single Choice: einzelne ID
            answers[questionId] = choiceId;
        }

        showQuestion();
    }

    function previousQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            showQuestion();
        }
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            showQuestion();
        }
    }

    async function submitQuiz() {
        console.log('=== SUBMIT QUIZ ===');
        console.log('Answers:', answers);

        // Helper function to check if choice is correct
        const isChoiceCorrect = (choice) => {
            if (!choice) return false;
            const val = choice.isCorrect ?? choice.is_correct;
            // Handle: true, 1, "1", or any truthy value
            return val === true || val === 1 || val === "1" || val === '1';
        };

        // Calculate score
        let correct = 0;
        let total = questions.length;

        questions.forEach(question => {
            console.log(`\n--- Question ${question.id}: ${question.text} ---`);
            console.log('Type:', question.qtype);

            const userAnswer = answers[question.id];
            console.log('User answer:', userAnswer);

            if (question.qtype === 'MULTIPLE') {
                // Multiple Choice: Check if ALL correct answers are selected AND no wrong ones
                const correctChoices = question.choices.filter(c => isChoiceCorrect(c));
                const userChoices = userAnswer || [];

                console.log('Correct choice IDs:', correctChoices.map(c => c.id));
                console.log('User selected IDs:', userChoices);

                // Check if user selected exactly the right choices
                const allCorrectSelected = correctChoices.every(c => userChoices.includes(c.id));
                const noWrongSelected = userChoices.every(id => {
                    const choice = question.choices.find(c => c.id === id);
                    return isChoiceCorrect(choice);
                });

                if (allCorrectSelected && noWrongSelected && correctChoices.length > 0) {
                    correct++;
                    console.log('✅ CORRECT');
                } else {
                    console.log('❌ WRONG');
                }

            } else {
                // Single Choice
                if (userAnswer) {
                    const choice = question.choices?.find(c => c.id === userAnswer);
                    console.log('Selected choice:', choice);

                    if (isChoiceCorrect(choice)) {
                        correct++;
                        console.log('✅ CORRECT');
                    } else {
                        console.log('❌ WRONG');
                    }
                } else {
                    console.log('❌ NO ANSWER');
                }
            }
        });

        console.log(`\n=== FINAL SCORE: ${correct}/${total} ===`);
        const score = Math.round((correct / total) * 100);
        console.log('Percentage:', score + '%');

        // Submit to backend
        try {
            await window.auth.authFetch(`/api/quizzes/${quizId}/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ answers })
            });
        } catch (error) {
            console.error('Error submitting quiz:', error);
        }

        // Show results
        showResults(score, correct, total);
    }

    function showResults(score, correct, total) {
        let message = '';
        let emoji = '';

        if (score >= 90) {
            message = 'Hervorragend!';
            emoji = '🏆';
        } else if (score >= 75) {
            message = 'Sehr gut!';
            emoji = '🌟';
        } else if (score >= 60) {
            message = 'Gut gemacht!';
            emoji = '👍';
        } else {
            message = 'Weiter üben!';
            emoji = '💪';
        }

        // Generate review section
        let reviewHtml = '<div style="margin-top: 40px; text-align: left;">';
        reviewHtml += '<h3 style="margin-bottom: 20px; color: #333;">📋 Fragen-Übersicht</h3>';

        questions.forEach((question, index) => {
            const userAnswer = answers[question.id];
            let isCorrect = false;
            let correctAnswerText = '';
            let userAnswerText = '';

            // Helper function to check if choice is correct
            const isChoiceCorrect = (choice) => {
                if (!choice) return false;
                const val = choice.isCorrect ?? choice.is_correct;
                // Handle: true, 1, "1", or any truthy value
                return val === true || val === 1 || val === "1" || val === '1';
            };

            if (question.qtype === 'MULTIPLE') {
                const correctChoices = question.choices.filter(c => isChoiceCorrect(c));
                const userChoices = userAnswer || [];

                const allCorrectSelected = correctChoices.every(c => userChoices.includes(c.id));
                const noWrongSelected = userChoices.every(id => {
                    const choice = question.choices.find(c => c.id === id);
                    return isChoiceCorrect(choice);
                });

                isCorrect = allCorrectSelected && noWrongSelected && correctChoices.length > 0;

                correctAnswerText = correctChoices.map(c => '✓ ' + c.text).join('<br>');
                userAnswerText = userChoices.map(id => {
                    const choice = question.choices.find(c => c.id === id);
                    return choice ? choice.text : 'N/A';
                }).join('<br>') || 'Keine Antwort';

            } else {
                if (userAnswer) {
                    const choice = question.choices?.find(c => c.id === userAnswer);
                    isCorrect = isChoiceCorrect(choice);
                    userAnswerText = choice ? choice.text : 'N/A';
                } else {
                    userAnswerText = 'Keine Antwort';
                }

                const correctChoice = question.choices?.find(c => isChoiceCorrect(c));
                correctAnswerText = correctChoice ? '✓ ' + correctChoice.text : 'Keine richtige Antwort gefunden';
            }

            reviewHtml += `
                    <div style="background: ${isCorrect ? '#e8f5e9' : '#ffebee'}; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid ${isCorrect ? '#4caf50' : '#f44336'};">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <span style="font-size: 1.5em;">${isCorrect ? '✅' : '❌'}</span>
                            <strong style="color: #333;">Frage ${index + 1}</strong>
                        </div>
                        <p style="color: #333; margin-bottom: 15px;">${question.text}</p>
                        <div style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                            <strong style="color: #666; font-size: 0.9em;">Deine Antwort:</strong>
                            <div style="color: #333; margin-top: 5px;">${userAnswerText}</div>
                        </div>
                        ${!isCorrect ? `
                            <div style="background: #fff8e1; padding: 15px; border-radius: 8px;">
                                <strong style="color: #f57c00; font-size: 0.9em;">Richtige Antwort:</strong>
                                <div style="color: #333; margin-top: 5px;">${correctAnswerText}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
        });

        reviewHtml += '</div>';

        const html = `
                <div class="results-card">
                    <div style="font-size: 4em;">${emoji}</div>
                    <h2>${message}</h2>
                    <div class="score-display">${score}%</div>
                    <p class="results-message">Du hast ${correct} von ${total} Fragen richtig beantwortet!</p>

                    <div class="results-details">
                        <div class="result-stat">
                            <div class="result-stat-value">${correct}</div>
                            <div class="result-stat-label">Richtig</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value">${total - correct}</div>
                            <div class="result-stat-label">Falsch</div>
                        </div>
                        <div class="result-stat">
                            <div class="result-stat-value">${total}</div>
                            <div class="result-stat-label">Gesamt</div>
                        </div>
                    </div>

                    ${reviewHtml}

                    <div style="display: flex; gap: 15px; justify-content: center; margin-top: 30px;">
                        <button class="btn btn-prev" onclick="window.location.reload()">Nochmal versuchen</button>
                        <button class="btn btn-next" onclick="window.location.href='/quizzes.html'">Zurück zur Übersicht</button>
                    </div>
                </div>
            `;

        document.getElementById('quizContent').innerHTML = html;
    }
</script>
</body>
</html>
