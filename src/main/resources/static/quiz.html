<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Quiz - RadBrain</title>
    <link rel="stylesheet" href="style.css"/>
    <style>
        .question {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
        }
        .question.correct {
            border-left-color: #28a745;
            background: #e8f5e9;
        }
        .question.incorrect {
            border-left-color: #dc3545;
            background: #ffebee;
        }
        .choice-label {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .choice-label:hover {
            background: rgba(0,123,255,0.1);
        }
        .choice-label.correct-answer {
            background: #d4edda;
            border: 2px solid #28a745;
        }
        .choice-label.wrong-answer {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }
        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .result-box h2 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }
        .result-box p {
            margin: 5px 0;
            font-size: 1.2em;
        }
        .btn-primary {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
        .btn-primary:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .feedback-icon {
            font-size: 24px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
<main class="container" style="max-width:900px;margin:28px auto;">
    <h1 id="qTitle">Quiz</h1>
    <p id="qDesc"></p>
    <div id="questions"></div>
    <div style="margin-top:12px;">
        <button id="submitBtn" class="btn-primary">Abgeben</button>
    </div>
    <div id="result" style="margin-top:12px;"></div>
</main>

<script src="/auth.js"></script>
<script>
    (async function() {
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        if (!id) { alert('Kein Quiz angegeben'); location.href = '/'; return; }

        const titleEl = document.getElementById('qTitle');
        const descEl = document.getElementById('qDesc');
        const questionsEl = document.getElementById('questions');
        const submitBtn = document.getElementById('submitBtn');
        const resultEl = document.getElementById('result');

        const res = await fetch('/api/quizzes/' + id);
        if (!res.ok) { alert('Quiz nicht gefunden'); location.href='/'; return; }
        const quiz = await res.json();

        titleEl.textContent = quiz.title;
        descEl.textContent = quiz.description || '';

        const answers = {};
        const questionElements = {};

        quiz.questions.forEach((q, idx) => {
            const div = document.createElement('div');
            div.className = 'question';
            div.id = 'question-' + q.id;
            questionElements[q.id] = div;

            const questionText = document.createElement('div');
            questionText.innerHTML = `<strong>${idx+1}. ${q.text}</strong>`;
            div.appendChild(questionText);

            const choicesDiv = document.createElement('div');
            choicesDiv.style.marginTop = '15px';

            if (q.qtype === 'SHORT_TEXT') {
                const ta = document.createElement('textarea');
                ta.style.width = '100%';
                ta.rows = 3;
                ta.style.padding = '10px';
                ta.style.borderRadius = '4px';
                ta.style.border = '1px solid #ced4da';
                ta.addEventListener('input', () => { answers[q.id] = ta.value; });
                choicesDiv.appendChild(ta);
            } else {
                q.choices.forEach(c => {
                    const wrapper = document.createElement('label');
                    wrapper.className = 'choice-label';
                    wrapper.dataset.choiceId = c.id;

                    const inp = document.createElement('input');
                    inp.type = (q.qtype === 'SINGLE' || q.qtype === 'TRUE_FALSE') ? 'radio' : 'checkbox';
                    inp.name = 'q_' + q.id;
                    inp.value = c.id;

                    inp.addEventListener('change', () => {
                        if (q.qtype === 'SINGLE' || q.qtype === 'TRUE_FALSE') {
                            answers[q.id] = [Number(inp.value)];
                        } else {
                            const boxes = Array.from(document.querySelectorAll('input[name="q_' + q.id + '"]'));
                            const sel = boxes.filter(b => b.checked).map(b => Number(b.value));
                            answers[q.id] = sel;
                        }
                    });

                    wrapper.appendChild(inp);
                    const span = document.createElement('span');
                    span.textContent = c.text;
                    wrapper.appendChild(span);
                    choicesDiv.appendChild(wrapper);
                });
            }

            div.appendChild(choicesDiv);
            questionsEl.appendChild(div);
        });

        submitBtn.addEventListener('click', async () => {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Wird ausgewertet...';

            const payload = { answers };
            const submitRes = await window.auth.authFetch('/api/quizzes/' + id + '/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const body = await submitRes.json().catch(() => ({}));

            if (!submitRes.ok) {
                resultEl.innerHTML = '<div style="color:#e04e4e;padding:12px;background:#ffebee;border-radius:8px">Fehler: ' + (body.error || body.message || submitRes.statusText) + '</div>';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Abgeben';
                return;
            }

            // Ergebnis anzeigen
            const score = body.scorePct || 0;
            const passed = body.passed || false;
            const correctCount = body.correctCount || 0;
            const totalQuestions = body.totalQuestions || 0;

            resultEl.innerHTML = `
                <div class="result-box">
                    <div class="feedback-icon">${passed ? '🎉' : '📚'}</div>
                    <h2>${score}%</h2>
                    <p>${correctCount} von ${totalQuestions} Fragen richtig</p>
                    <p>${passed ? 'Bestanden! Gut gemacht!' : 'Nicht bestanden. Versuch es nochmal!'}</p>
                </div>
            `;

            // Fragen markieren und richtige Antworten zeigen
            if (body.detailedResults) {
                Object.entries(body.detailedResults).forEach(([questionId, result]) => {
                    const questionDiv = questionElements[questionId];
                    if (!questionDiv) return;

                    if (result.isCorrect) {
                        questionDiv.classList.add('correct');
                    } else {
                        questionDiv.classList.add('incorrect');
                    }

                    // Bei Multiple Choice: Richtige Antworten markieren
                    if (result.correctChoiceIds && result.correctChoiceIds.length > 0) {
                        result.correctChoiceIds.forEach(correctId => {
                            const label = questionDiv.querySelector(`label[data-choice-id="${correctId}"]`);
                            if (label) {
                                label.classList.add('correct-answer');
                            }
                        });

                        // Falsche User-Antworten markieren
                        if (result.userAnswer && Array.isArray(result.userAnswer)) {
                            result.userAnswer.forEach(userChoiceId => {
                                if (!result.correctChoiceIds.includes(userChoiceId)) {
                                    const label = questionDiv.querySelector(`label[data-choice-id="${userChoiceId}"]`);
                                    if (label) {
                                        label.classList.add('wrong-answer');
                                    }
                                }
                            });
                        }
                    }
                });
            }

            submitBtn.textContent = 'Nochmal versuchen';
            submitBtn.disabled = false;
            submitBtn.onclick = () => location.reload();
        });

    })();
</script>
</body>
</html>
