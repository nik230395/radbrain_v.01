<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Email verifizieren - RadBrain</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>
    .card { max-width:520px; margin:48px auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 14px 40px rgba(14,10,36,0.06); }
    .input-row { margin-bottom:12px; }
    label { display:block; font-weight:600; margin-bottom:6px; color:#444; }
    input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {
      width:100%; padding:10px 12px; border-radius:8px; border:1px solid #e6e6f2; font-size:1rem;
    }
    .buttons { display:flex; gap:10px; align-items:center; margin-top:8px; }
    .btn { padding:10px 14px; border-radius:10px; border:0; cursor:pointer; font-weight:700; }
    .btn-primary { background:linear-gradient(135deg,#645CBB,#A084DC); color:#fff; }
    .btn-secondary { background:#f3f3f6; color:#333; border:1px solid #ececf6; }
    .helper { color:#666; margin-bottom:12px; }
    .message { margin-top:12px; padding:10px; border-radius:8px; display:none; }
    .message.error { background:#ffecec; color:#8a1f1f; display:block; }
    .message.success { background:#e8ffef; color:#0a5f2b; display:block; }
  </style>
</head>
<body>
<main class="container">
  <div class="card" role="region" aria-labelledby="verifyTitle">
    <h1 id="verifyTitle">Email verifizieren</h1>
    <p class="helper">Gib den Verifizierungscode ein, den wir an deine Email gesendet haben. Falls du keinen Code erhalten hast, benutze "Code erneut senden".</p>

    <form id="verifyForm" novalidate>
      <div id="emailRow" class="input-row">
        <label for="emailInput">Email</label>
        <input id="emailInput" name="email" type="email" required placeholder="deine@email.de" autocomplete="email">
      </div>

      <div class="input-row">
        <label for="codeInput">Verifikationscode</label>
        <input id="codeInput" name="code" type="text" required pattern="[0-9]{6}" inputmode="numeric" maxlength="6" placeholder="6-stelliger Code" autocomplete="one-time-code">
      </div>

      <div class="buttons">
        <button id="submitBtn" type="submit" class="btn btn-primary">Verifizieren</button>
        <button id="resendBtn" type="button" class="btn btn-secondary">Code erneut senden</button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<!-- Load auth helper (ensure path is /auth.js, file should be in src/main/resources/static/auth.js) -->
<script src="/auth.js"></script>

<script>
  (function(){
    const form = document.getElementById('verifyForm');
    const emailInput = document.getElementById('emailInput');
    const emailRow = document.getElementById('emailRow');
    const codeInput = document.getElementById('codeInput');
    const resendBtn = document.getElementById('resendBtn');
    const msg = document.getElementById('message');

    function showMessage(text, type) {
      msg.textContent = text || '';
      msg.className = type ? 'message ' + type : 'message';
    }

    // If verificationEmail exists from registration, auto-fill and hide the input
    const storedEmail = (localStorage.getItem('verificationEmail') || '').trim();
    if (storedEmail) {
      emailInput.value = storedEmail;
      // hide visible input but keep value for submission
      emailRow.style.display = 'none';
      const info = document.createElement('div');
      info.className = 'helper';
      info.textContent = 'Verifizierungscode gesendet an: ' + storedEmail;
      form.insertBefore(info, codeInput.parentElement);
    } else {
      emailRow.style.display = 'block';
    }

    function validateInput(email, code) {
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return {ok:false, msg:'Bitte gültige Email angeben.'};
      }
      if (!/^[0-9]{6}$/.test(code)) {
        return {ok:false, msg:'Der Code muss genau 6 Ziffern enthalten.'};
      }
      return {ok:true};
    }

    form.addEventListener('submit', async function(e){
      e.preventDefault();
      showMessage('', null);

      const email = (emailInput.value || '').trim();
      const code = (codeInput.value || '').trim();

      const v = validateInput(email, code);
      if (!v.ok) {
        showMessage(v.msg, 'error');
        return;
      }

      showMessage('Überprüfe Code...', null);
      try {
        const res = await fetch('/api/users/verify', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, code })
        });
        const body = await res.json().catch(()=> ({}));
        if (!res.ok) {
          showMessage('Fehler: ' + (body.error || body.message || res.statusText), 'error');
          return;
        }

        // Expect token + user info on success
        if (body.token) {
          // store token + basic user info (auth.js uses authToken)
          localStorage.setItem('authToken', body.token);
          if (body.email) localStorage.setItem('userEmail', body.email);
          if (body.fullname) localStorage.setItem('userFullname', body.fullname);
          if (body.id) localStorage.setItem('userId', body.id);

          // remove verificationEmail now it's used
          localStorage.removeItem('verificationEmail');

          showMessage('E-Mail erfolgreich verifiziert. Du wirst weitergeleitet...', 'success');

          setTimeout(() => {
            // go to home as logged-in user
            window.location.href = '/';
          }, 900);
          return;
        }

        // fallback: if service returns message verified but no token
        if (body.message === 'verified') {
          showMessage('E-Mail verifiziert. Bitte melde dich an.', 'success');
          setTimeout(()=> window.location.href = '/login.html', 900);
          return;
        }

        showMessage('Unerwartete Antwort vom Server.', 'error');

      } catch (err) {
        showMessage('Netzwerkfehler: ' + (err.message || err), 'error');
      }
    });

    resendBtn.addEventListener('click', async function(){
      showMessage('', null);

      // prefer storedEmail, else ask user
      let email = (emailInput.value || '').trim();
      if (!email) {
        const promptEmail = (prompt('Bitte gib deine Email ein, um den Code erneut zu senden:') || '').trim();
        if (!promptEmail) return;
        email = promptEmail;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMessage('Ungültige Email.', 'error');
        return;
      }

      showMessage('Sende neuen Code...', null);
      try {
        const res = await fetch('/api/users/resend', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email })
        });
        const body = await res.json().catch(()=> ({}));
        if (!res.ok) {
          showMessage('Fehler: ' + (body.error || body.message || res.statusText), 'error');
          return;
        }
        // store for convenience
        localStorage.setItem('verificationEmail', email);
        showMessage('Neuer Code wurde gesendet. Bitte prüfe deine Email.', 'success');
      } catch (err) {
        showMessage('Netzwerkfehler: ' + (err.message || err), 'error');
      }
    });

  })();
</script>
</body>
</html>
