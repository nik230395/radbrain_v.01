<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Mail Verifizierung - RadBrain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .verify-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #645CBB 0%, #A084DC 50%, #BFACE2 100%);
    }
    .verify-card {
      border-radius: 15px;
      border: none;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }
    .btn-primary-custom {
      background: linear-gradient(135deg, #645CBB, #A084DC);
      border: none;
      border-radius: 8px;
      padding: 12px;
    }
    .btn-primary-custom:hover {
      background:  linear-gradient(135deg, #5a52a5, #8f73c7);
    }
    .verification-code-input {
      font-size: 2rem;
      text-align: center;
      letter-spacing: 0.5rem;
      border-radius: 8px;
      border: 2px solid #ddd;
    }
    .verification-code-input:focus {
      border-color: #645CBB;
      box-shadow: 0 0 0 0.2rem rgba(100, 92, 187, 0.25);
    }
  </style>
</head>
<body>
<div class="verify-container d-flex align-items-center justify-content-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card verify-card shadow-lg">
          <div class="card-body p-5 text-center">
            <div class="mb-4">
              <div class="text-primary mb-3" style="font-size: 3rem;">📧</div>
              <h1 class="h3 mb-3 fw-bold text-primary" style="color: #645CBB !important;">E-Mail bestätigen</h1>
              <p class="text-muted mb-0">
                Wir haben einen Bestätigungscode an<br>
                <strong id="userEmail">Ihre E-Mail-Adresse</strong> gesendet.
              </p>
            </div>

            <form id="verifyForm" onsubmit="handleVerify(event)">
              <div class="mb-4">
                <label for="verificationCode" class="form-label fw-semibold">Verifikationscode</label>
                <input type="text"
                       class="form-control verification-code-input"
                       id="verificationCode"
                       name="verificationCode"
                       maxlength="6"
                       required
                       placeholder="000000"
                       autocomplete="one-time-code">
                <small class="form-text text-muted">6-stelliger Code</small>
              </div>

              <button type="submit" class="btn btn-primary-custom w-100 fw-semibold mb-3" id="verifyBtn">
                <span class="btn-text">E-Mail bestätigen</span>
                <span class="btn-loading d-none">
                                        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                                        Wird geprüft...
                                    </span>
              </button>
            </form>

            <div id="alertContainer" class="mb-3"></div>

            <div class="text-center">
              <p class="text-muted mb-2">Code nicht erhalten?</p>
              <button type="button" class="btn btn-outline-secondary" id="resendBtn" onclick="resendCode()">
                Code erneut senden
              </button>
            </div>

            <hr class="my-4">

            <div class="text-center">
              <p class="mb-0">
                <a href="login.html" class="text-decoration-none fw-semibold" style="color:  #645CBB;">
                  ← Zurück zur Anmeldung
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  let currentEmail = '';

  function showAlert(message, type = 'danger') {
    const alertContainer = document.getElementById('alertContainer');
    alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
  }

  function setLoading(loading, buttonId = 'verifyBtn') {
    const btn = document.getElementById(buttonId);
    const btnText = btn.querySelector('.btn-text');
    const btnLoading = btn.querySelector('.btn-loading');

    if (loading) {
      if (btnText) btnText.classList.add('d-none');
      if (btnLoading) btnLoading.classList. remove('d-none');
      btn.disabled = true;
    } else {
      if (btnText) btnText.classList.remove('d-none');
      if (btnLoading) btnLoading.classList.add('d-none');
      btn.disabled = false;
    }
  }

  async function handleVerify(event) {
    event.preventDefault();

    const code = document.getElementById('verificationCode').value.trim();

    if (!code || code.length !== 6) {
      showAlert('Bitte geben Sie einen 6-stelligen Code ein.', 'warning');
      return;
    }

    try {
      setLoading(true);

      const response = await fetch('/api/users/verify', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
        },
        body: JSON.stringify({
          email: currentEmail,
          code: code
        })
      });

      const data = await response.json();
      console.log('📡 Verify response:', data);

      if (response.ok) {
        // ✅ Erfolgreich verifiziert
        showAlert('✅ E-Mail erfolgreich bestätigt! Sie werden angemeldet... ', 'success');

        // Token speichern
        if (data.token) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('userInfo', JSON.stringify({
            id: data.id,
            email: data. email,
            fullname: data.fullname
          }));
        }

        // Cleanup
        localStorage.removeItem('registrationEmail');
        localStorage.removeItem('registrationName');

        // Weiterleitung nach Dashboard
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 2000);

      } else {
        console.error('❌ Verification failed:', data);
        showAlert(data.error || 'Ungültiger oder abgelaufener Code.', 'danger');
      }
    } catch (error) {
      console.error('💥 Verification error:', error);
      showAlert('Verbindungsfehler. Bitte versuchen Sie es erneut.', 'danger');
    } finally {
      setLoading(false);
    }
  }

  async function resendCode() {
    if (!currentEmail) {
      showAlert('E-Mail-Adresse nicht gefunden.', 'danger');
      return;
    }

    try {
      setLoading(true, 'resendBtn');

      const response = await fetch('/api/users/resend', {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
        },
        body: JSON.stringify({
          email: currentEmail
        })
      });

      const data = await response.json();

      if (response.ok) {
        showAlert('📧 Neuer Code wurde gesendet! ', 'success');
      } else {
        showAlert(data.error || 'Code konnte nicht erneut gesendet werden.', 'danger');
      }
    } catch (error) {
      console.error('💥 Resend error:', error);
      showAlert('Verbindungsfehler. ', 'danger');
    } finally {
      setLoading(false, 'resendBtn');
    }
  }

  // Page initialization
  window.addEventListener('DOMContentLoaded', function() {
    // E-Mail aus localStorage laden
    const storedEmail = localStorage.getItem('registrationEmail');
    const storedName = localStorage.getItem('registrationName');

    if (storedEmail) {
      currentEmail = storedEmail;
      document.getElementById('userEmail').textContent = storedEmail;
    } else {
      // Fallback - zurück zur Registrierung
      showAlert('Keine E-Mail-Adresse gefunden. Sie werden zur Registrierung weitergeleitet.', 'warning');
      setTimeout(() => {
        window.location.href = 'register.html';
      }, 3000);
    }
  });

  // Auto-focus und nur Zahlen erlauben
  document.getElementById('verificationCode').addEventListener('input', function(e) {
    // Nur Zahlen erlauben
    this.value = this. value.replace(/[^0-9]/g, '');

    // Auto-submit bei 6 Zeichen
    if (this.value.length === 6) {
      setTimeout(() => {
        document. getElementById('verifyForm').dispatchEvent(new Event('submit'));
      }, 500);
    }
  });
</script>
</body>
</html>
