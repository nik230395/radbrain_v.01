<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrieren - RadBrain</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-50);
      padding: var(--space-8) var(--space-4);
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-xl);
      padding: var(--space-10);
      box-shadow: var(--shadow-lg);
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .auth-logo {
      height: 48px;
      margin-bottom: var(--space-6);
    }

    .auth-title {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: var(--space-2);
    }

    .auth-subtitle {
      color: var(--gray-600);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--gray-600);
      text-decoration: none;
      margin-bottom: var(--space-6);
      font-size: 0.9375rem;
      transition: color var(--transition-fast);
    }

    .back-link:hover {
      color: var(--primary);
    }

    .divider {
      text-align: center;
      margin: var(--space-6) 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--gray-200);
    }

    .divider-text {
      position: relative;
      display: inline-block;
      padding: 0 var(--space-4);
      background: white;
      color: var(--gray-500);
      font-size: 0.875rem;
    }

    .password-requirements {
      margin-top: var(--space-2);
      padding: var(--space-3);
      background: var(--gray-50);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
    }

    .requirement {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--gray-600);
      margin-bottom: var(--space-1);
    }

    .requirement:last-child {
      margin-bottom: 0;
    }

    .requirement.met {
      color: var(--success);
    }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-container">
    <a href="/index.html" class="back-link">
      ← Zurück zur Startseite
    </a>

    <div class="auth-card">
      <div class="auth-header">
        <img src="logo.png" alt="RadBrain" class="auth-logo">
        <h1 class="auth-title">Konto erstellen</h1>
        <p class="auth-subtitle">Starte deine Lernreise mit RadBrain</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="fullname">Vollständiger Name</label>
          <input
                  type="text"
                  id="fullname"
                  class="form-input"
                  placeholder="Max Mustermann"
                  required
                  autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">E-Mail-Adresse</label>
          <input
                  type="email"
                  id="email"
                  class="form-input"
                  placeholder="deine@email.de"
                  required
                  autocomplete="email">
          <div class="form-helper">
            Du erhältst einen Bestätigungscode per E-Mail
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Passwort</label>
          <input
                  type="password"
                  id="password"
                  class="form-input"
                  placeholder="Mindestens 8 Zeichen"
                  required
                  autocomplete="new-password">
          <div class="password-requirements" id="passwordRequirements" style="display: none;">
            <div class="requirement" id="req-length">
              <span id="check-length">○</span> Mindestens 8 Zeichen
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Passwort bestätigen</label>
          <input
                  type="password"
                  id="confirmPassword"
                  class="form-input"
                  placeholder="Passwort wiederholen"
                  required
                  autocomplete="new-password">
        </div>

        <div id="registerMessage" class="alert" style="display: none; margin-bottom: var(--space-4);"></div>

        <button type="submit" class="btn btn-primary btn-lg" id="registerBtn" style="width: 100%;">
          Registrieren
        </button>

        <p style="text-align: center; margin-top: var(--space-4); font-size: 0.875rem; color: var(--gray-600);">
          Mit der Registrierung stimmst du unseren Nutzungsbedingungen zu
        </p>
      </form>

      <div class="divider">
        <span class="divider-text">Bereits registriert?</span>
      </div>

      <a href="/login.html" class="btn btn-outline" style="width: 100%;">
        Jetzt anmelden
      </a>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const form = document.getElementById('registerForm');
  const fullnameInput = document.getElementById('fullname');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const registerBtn = document.getElementById('registerBtn');
  const messageDiv = document.getElementById('registerMessage');
  const requirementsDiv = document.getElementById('passwordRequirements');

  // Show password requirements on focus
  passwordInput.addEventListener('focus', () => {
    requirementsDiv.style.display = 'block';
  });

  // Check password requirements
  passwordInput.addEventListener('input', () => {
    const password = passwordInput.value;
    const lengthReq = document.getElementById('req-length');
    const checkLength = document.getElementById('check-length');

    if (password.length >= 8) {
      lengthReq.classList.add('met');
      checkLength.textContent = '✓';
    } else {
      lengthReq.classList.remove('met');
      checkLength.textContent = '○';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const fullname = fullnameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    // Validation
    if (!fullname || !email || !password || !confirmPassword) {
      showMessage('Bitte fülle alle Felder aus.', 'error');
      return;
    }

    if (password.length < 8) {
      showMessage('Passwort muss mindestens 8 Zeichen lang sein.', 'error');
      return;
    }

    if (password !== confirmPassword) {
      showMessage('Passwörter stimmen nicht überein.', 'error');
      return;
    }

    const originalText = registerBtn.textContent;
    registerBtn.disabled = true;
    registerBtn.innerHTML = '<div class="loading"></div>';

    try {
      const response = await fetch('/api/users/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullname, email, password })
      });

      const result = await response.json();

      if (response.ok) {
        // Store email for verification page
        localStorage.setItem('registrationEmail', email);
        localStorage.setItem('registrationName', fullname);

        showMessage('Registrierung erfolgreich! Weiterleitung zur Verifizierung...', 'success');

        setTimeout(() => {
          window.location.href = `/verify.html?email=${encodeURIComponent(email)}`;
        }, 1500);
      } else {
        showMessage(result.error || 'Registrierung fehlgeschlagen', 'error');
      }
    } catch (error) {
      console.error('Registration error:', error);
      showMessage('Verbindungsfehler. Bitte versuche es erneut.', 'error');
    } finally {
      registerBtn.disabled = false;
      registerBtn.textContent = originalText;
    }
  });

  function showMessage(message, type) {
    messageDiv.className = `alert alert-${type}`;
    messageDiv.textContent = message;
    messageDiv.style.display = 'block';
  }

  // Auto-focus fullname field
  fullnameInput.focus();
</script>

</body>
</html>
