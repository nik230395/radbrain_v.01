<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Mail Verifizierung - RadBrain</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .verify-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, var(--primary-600) 50%, var(--secondary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      position: relative;
      overflow: hidden;
    }

    .verify-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.1), transparent 50%);
      animation: float 8s ease-in-out infinite;
    }

    .verify-card {
      background: var(--white);
      max-width: 480px;
      width: 100%;
      padding: var(--space-3xl);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-2xl);
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .verify-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--primary-600), var(--secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-lg);
      font-size: 2.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .verify-title {
      font-size: 1.875rem;
      font-weight: 800;
      color: var(--gray-900);
      margin-bottom: var(--space-md);
    }

    .verify-subtitle {
      color: var(--gray-600);
      margin-bottom: var(--space-2xl);
      line-height: 1.6;
    }

    .verify-email {
      color: var(--primary-600);
      font-weight: 600;
    }

    .code-inputs {
      display: flex;
      gap: var(--space-sm);
      justify-content: center;
      margin: var(--space-xl) 0;
    }

    .code-input {
      width: 50px;
      height: 60px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-lg);
      background: var(--gray-50);
      transition: var(--transition-fast);
    }

    .code-input:focus {
      outline: none;
      border-color: var(--primary-600);
      background: var(--white);
      box-shadow: 0 0 0 3px var(--primary-50);
    }

    .code-input.filled {
      border-color: var(--primary-600);
      background: var(--primary-50);
    }

    .message {
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-lg);
      font-weight: 500;
      display: none;
      animation: slideIn 0.3s ease-out;
    }

    .message.error {
      background: var(--error-light);
      color: var(--error);
      border: 2px solid var(--error);
    }

    .message.success {
      background: var(--success-light);
      color: var(--success);
      border: 2px solid var(--success);
    }

    .resend-section {
      margin-top: var(--space-xl);
      padding-top: var(--space-xl);
      border-top: 1px solid var(--gray-200);
    }

    .back-link {
      position: absolute;
      top: var(--space-xl);
      left: var(--space-xl);
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-lg);
      background: rgba(255,255,255,0.9);
      border-radius: var(--radius-full);
      color: var(--gray-700);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition-base);
      z-index: 3;
    }

    .back-link:hover {
      background: var(--white);
      box-shadow: var(--shadow-md);
      transform: translateX(-4px);
    }

    /* Mobile Optimizations */
    @media (max-width: 640px) {
      .verify-container {
        padding: var(--space-md);
      }

      .verify-card {
        padding: var(--space-xl);
      }

      .verify-title {
        font-size: 1.5rem;
      }

      .code-inputs {
        gap: 6px;
      }

      .code-input {
        width: 42px;
        height: 50px;
        font-size: 1.25rem;
      }

      .back-link {
        top: var(--space-md);
        left: var(--space-md);
        padding: var(--space-sm) var(--space-md);
        font-size: 0.875rem;
      }
    }

    /* Loading state */
    .btn-loading {
      position: relative;
      color: transparent !important;
    }

    .btn-loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin: -10px 0 0 -10px;
      border: 2px solid transparent;
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="verify-container">
  <a href="login.html" class="back-link">
    ← Zurück zur Anmeldung
  </a>

  <div class="verify-card">
    <div class="verify-icon">📧</div>

    <h1 class="verify-title">E-Mail bestätigen</h1>

    <p class="verify-subtitle">
      Wir haben einen 6-stelligen Code an<br>
      <span class="verify-email" id="userEmail">Ihre E-Mail-Adresse</span> gesendet.
    </p>

    <form id="verifyForm">
      <div class="code-inputs" id="codeInputs">
        <input type="text" class="code-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]*">
        <input type="text" class="code-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]*">
        <input type="text" class="code-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]*">
        <input type="text" class="code-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]*">
        <input type="text" class="code-input" maxlength="1" data-index="4" inputmode="numeric" pattern="[0-9]*">
        <input type="text" class="code-input" maxlength="1" data-index="5" inputmode="numeric" pattern="[0-9]*">
      </div>

      <div id="verifyMessage" class="message"></div>

      <button type="submit" class="btn btn-primary" id="verifyBtn" style="width: 100%; justify-content: center; padding: 1rem;">
        Code bestätigen
      </button>
    </form>

    <div class="resend-section">
      <p style="color: var(--gray-600); margin-bottom: var(--space-md);">Code nicht erhalten?</p>
      <button type="button" class="btn btn-secondary" id="resendBtn" style="width: 100%; justify-content: center;">
        Code erneut senden
      </button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  (function() {
    'use strict';

    console.log('📧 Verifizierungsseite geladen');

    let currentEmail = '';
    const form = document.getElementById('verifyForm');
    const verifyBtn = document.getElementById('verifyBtn');
    const resendBtn = document.getElementById('resendBtn');
    const codeInputs = document.querySelectorAll('.code-input');

    // Initialize
    initializePage();
    setupCodeInputs();

    function initializePage() {
      // E-Mail aus localStorage laden
      const storedEmail = localStorage.getItem('registrationEmail');

      if (storedEmail) {
        currentEmail = storedEmail;
        document.getElementById('userEmail').textContent = storedEmail;
      } else {
        showMessage('Keine E-Mail-Adresse gefunden. Sie werden zur Registrierung weitergeleitet.', 'error');
        setTimeout(() => {
          window.location.href = 'register.html';
        }, 3000);
      }

      // Auto-focus first input
      codeInputs[0].focus();
    }

    function setupCodeInputs() {
      codeInputs.forEach((input, index) => {
        // Only allow numbers
        input.addEventListener('input', function(e) {
          const value = e.target.value;

          // Remove non-digits
          if (!/^\d*$/.test(value)) {
            e.target.value = '';
            return;
          }

          // Add filled class
          if (value) {
            e.target.classList.add('filled');
          } else {
            e.target.classList.remove('filled');
          }

          // Auto-advance to next input
          if (value && index < codeInputs.length - 1) {
            codeInputs[index + 1].focus();
          }

          // Auto-submit when all filled
          if (value && index === codeInputs.length - 1) {
            const code = getCode();
            if (code.length === 6) {
              setTimeout(() => {
                form.dispatchEvent(new Event('submit'));
              }, 300);
            }
          }
        });

        // Handle backspace
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            codeInputs[index - 1].focus();
            codeInputs[index - 1].value = '';
            codeInputs[index - 1].classList.remove('filled');
          }
        });

        // Handle paste
        input.addEventListener('paste', function(e) {
          e.preventDefault();
          const pastedData = e.clipboardData.getData('text').trim();
          const digits = pastedData.replace(/\D/g, '').slice(0, 6);

          if (digits.length === 6) {
            digits.split('').forEach((digit, i) => {
              codeInputs[i].value = digit;
              codeInputs[i].classList.add('filled');
            });
            codeInputs[5].focus();

            // Auto-submit after paste
            setTimeout(() => {
              form.dispatchEvent(new Event('submit'));
            }, 300);
          }
        });
      });
    }

    function getCode() {
      return Array.from(codeInputs).map(input => input.value).join('');
    }

    function clearCode() {
      codeInputs.forEach(input => {
        input.value = '';
        input.classList.remove('filled');
      });
      codeInputs[0].focus();
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const code = getCode();

      if (code.length !== 6) {
        showMessage('Bitte geben Sie den vollständigen 6-stelligen Code ein.', 'error');
        return;
      }

      setLoading(verifyBtn, true);

      try {
        const response = await fetch('/api/users/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: currentEmail,
            code: code
          })
        });

        console.log('📡 Verify Response Status:', response.status);

        let data;
        try {
          data = await response.json();
          console.log('📦 Response Data:', data);
        } catch (jsonError) {
          console.error('❌ JSON Parse Error:', jsonError);

          // Wenn Server 200 zurückgibt aber kein JSON, ist es trotzdem erfolgreich
          if (response.ok) {
            data = { message: 'Verifizierung erfolgreich' };
          } else {
            throw new Error('Server-Antwort konnte nicht verarbeitet werden');
          }
        }

        if (response.ok) {
          // ✅ Erfolgreich verifiziert
          console.log('✅ Verifizierung erfolgreich!');

          showMessage('✅ E-Mail erfolgreich bestätigt! Sie werden angemeldet...', 'success');

          // Token speichern falls vorhanden
          if (data.token && window.auth) {
            window.auth.saveLogin(data);
          }

          // Cleanup
          localStorage.removeItem('registrationEmail');
          localStorage.removeItem('registrationName');

          // Weiterleitung
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 2000);

        } else {
          // ❌ Ungültiger Code
          console.error('❌ Verifizierung fehlgeschlagen:', data);
          showMessage(data.error || data.message || 'Ungültiger oder abgelaufener Code', 'error');
          clearCode();
        }

      } catch (error) {
        console.error('💥 Network Error:', error);
        showMessage('Verbindungsfehler: ' + error.message, 'error');
        clearCode();
      } finally {
        setLoading(verifyBtn, false);
      }
    });

    resendBtn.addEventListener('click', async function() {
      if (!currentEmail) {
        showMessage('E-Mail-Adresse nicht gefunden.', 'error');
        return;
      }

      setLoading(resendBtn, true);

      try {
        const response = await fetch('/api/users/resend', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: currentEmail
          })
        });

        let data;
        try {
          data = await response.json();
        } catch (jsonError) {
          if (response.ok) {
            data = { message: 'Code wurde erneut gesendet' };
          } else {
            throw new Error('Server-Antwort konnte nicht verarbeitet werden');
          }
        }

        if (response.ok) {
          showMessage('✅ Neuer Code wurde gesendet!', 'success');
          clearCode();
        } else {
          showMessage(data.error || data.message || 'Code konnte nicht erneut gesendet werden', 'error');
        }

      } catch (error) {
        console.error('💥 Resend Error:', error);
        showMessage('Verbindungsfehler: ' + error.message, 'error');
      } finally {
        setLoading(resendBtn, false);
      }
    });

    function showMessage(message, type) {
      const container = document.getElementById('verifyMessage');
      container.className = `message ${type}`;
      container.textContent = message;
      container.style.display = 'block';

      if (type === 'success') {
        setTimeout(() => {
          container.style.display = 'none';
        }, 5000);
      }
    }

    function setLoading(button, loading) {
      if (loading) {
        button.disabled = true;
        button.classList.add('btn-loading');
      } else {
        button.disabled = false;
        button.classList.remove('btn-loading');
      }
    }

  })();
</script>

</body>
</html>
