<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="style.css" rel="stylesheet">
    <script src="main.js" defer></script>
</head>
<body>
<!-- Header -->
<header class="admin-header">
    <h1>Admin Dashboard</h1>
    <nav class="admin-nav">
        <a href="#user-control">Manage Users</a>
        <a href="#quiz-control">Manage Quizzes</a>
        <a href="#statistics">Statistics</a>
    </nav>
</header>

<!-- Main Section -->
<main class="admin-main">
    <section id="user-control" class="admin-section">
        <h2>User Control</h2>
        <button onclick="loadUserList()">View/Edit/Delete Users</button>
        <div id="user-list">
            <!-- User data dynamically loaded -->
        </div>
    </section>

    <section id="quiz-control" class="admin-section">
        <h2>Quiz Control</h2>
        <button onclick="loadQuizManagement()">View/Edit/Delete Quizzes</button>
        <button onclick="createQuiz()">Add New Quiz</button>
        <div id="quiz-management">
            <!-- Quiz management panel, dynamically loaded -->
        </div>
    </section>

    <section id="statistics" class="admin-section">
        <h2>Statistics</h2>
        <div id="stats-overview">
            <!-- Statistics dynamically generated -->
            <p>Total Users: <span id="user-count">...</span></p>
            <p>Total Quizzes: <span id="quiz-count">...</span></p>
            <p>Total Quiz Attempts: <span id="attempt-count">...</span></p>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="admin-footer">
    <p>&copy; 2025 Admin Dashboard</p>
</footer>
</body>
</html>
