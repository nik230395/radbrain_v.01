<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel - RadBrain</title>
    <link href="style.css" rel="stylesheet">
    <script src="auth.js"></script>
    <script src="admin-panel.js" defer></script>
</head>
<body>
<!-- Header -->
<header class="admin-header">
    <div class="admin-header-content">
        <h1>Admin Control Panel</h1>
        <nav class="admin-nav">
            <a href="/user-home.html">Back to Home</a>
            <a href="/dashboard.html">Dashboard</a>
            <a href="#quiz-control">Manage Quizzes</a>
            <a href="#statistics">Statistics</a>
        </nav>
    </div>
</header>

<!-- Main Section -->
<main class="admin-main">
    <section id="quiz-control" class="admin-section">
        <div class="section-header">
            <h2>Quiz Management</h2>
            <button class="btn-primary" onclick="adminPanel.createNewQuiz()">+ Create New Quiz</button>
        </div>
        <div id="quiz-management">
            <p>Loading quizzes...</p>
            <!-- TODO: Quizze werden durch JS ausgegeben -->
        </div>
    </section>

    <section id="statistics" class="admin-section">
        <h2>Statistics</h2>
        <div id="stats-overview" class="stats-grid">

            <div class="stat-card">
                <h3>Total Users</h3>
                <p class="stat-number" id="user-count">...</p>
            </div>
            <div class="stat-card">
                <h3>Total Quizzes</h3>
                <p class="stat-number" id="quiz-count">...</p>
            </div>
            <div class="stat-card">
                <h3>Total Quiz Attempts</h3>
                <p class="stat-number" id="attempt-count">...</p>
            </div>
        </div>
    </section>
</main>

<footer class="admin-footer">
    <p>&copy; 2025 RadBrain Admin Panel</p>
</footer>
</body>
</html>
