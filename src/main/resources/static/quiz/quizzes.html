<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizzes - RadBrain</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <style>
        .quiz-header {
            background: linear-gradient(135deg, var(--primary) 0%, #1e40af 100%);
            color: white;
            padding: var(--space-16) 0;
        }
        .filter-bar {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            margin-bottom: var(--space-8);
        }
        .filter-group { display: flex; gap: var(--space-4); align-items: center; flex-wrap: wrap; }
        .search-input { flex: 1; min-width: 250px; }
        .category-filters { display: flex; gap: var(--space-2); flex-wrap: wrap; }
        .category-btn {
            padding: var(--space-2) var(--space-4);
            background: white;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-md);
            color: var(--gray-700);
            font-weight: 500;
            font-size: 0.9375rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .category-btn:hover { border-color: var(--primary); color: var(--primary); }
        .category-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
        .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6); }
        .quiz-card {
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            transition: all var(--transition-base);
            cursor: pointer;
            display: flex; flex-direction: column;
        }
        .quiz-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .quiz-category {
            display: inline-block; padding: var(--space-1) var(--space-3);
            background: var(--primary-light); color: var(--primary);
            border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 500;
            margin-bottom: var(--space-4); width: fit-content;
        }
        .quiz-title { font-size: 1.25rem; font-weight: 600; color: var(--gray-900); margin-bottom: var(--space-2); }
        .quiz-description { color: var(--gray-600); font-size: 0.9375rem; line-height: 1.6; margin-bottom: var(--space-4); flex: 1; }
        .quiz-meta { display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-4); border-top: 1px solid var(--gray-200); }
        .quiz-questions { color: var(--gray-500); font-size: 0.875rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-6); margin-bottom: var(--space-8); }
        .stat-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--space-6); text-align: center; }
        .stat-value { font-size: 2.5rem; font-weight: 700; color: var(--primary); margin-bottom: var(--space-2); }
        .stat-label { color: var(--gray-600); font-size: 0.9375rem; }
    </style>
</head>
<body>

<header class="quiz-header">
    <div class="container">
        <div style="max-width: 720px;">
            <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: var(--space-3); color: white;">Quizzes</h1>
            <p style="font-size: 1.125rem; color: rgba(255,255,255,0.9);">Teste dein Wissen mit praxisnahen Fragen und erhalte direktes Feedback</p>
        </div>
    </div>
</header>

<div class="container" style="padding-top: var(--space-12); padding-bottom: var(--space-16);">
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-value" id="totalQuizzes">0</div>
            <div class="stat-label">Verfügbare Quizzes</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalQuestions">0</div>
            <div class="stat-label">Fragen insgesamt</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="avgQuestions">0</div>
            <div class="stat-label">Ø Fragen pro Quiz</div>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-group">
            <input type="text" id="searchInput" class="form-input search-input" placeholder="Quiz suchen..." onkeyup="filterQuizzes()">
            <div class="category-filters">
                <button class="category-btn active" onclick="filterCategory(event, 'ALL')">Alle</button>
                <button class="category-btn" onclick="filterCategory(event, 'ROENTGEN')">Röntgen</button>
                <button class="category-btn" onclick="filterCategory(event, 'CT')">CT</button>
                <button class="category-btn" onclick="filterCategory(event, 'MRT')">MRT</button>
                <button class="category-btn" onclick="filterCategory(event, 'ULTRASCHALL')">Ultraschall</button>
            </div>
        </div>
    </div>

    <div id="quizContainer">
        <div style="text-align: center; padding: var(--space-12);">
            <p style="color: var(--gray-600);">Lade Quizzes...</p>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/navbar.js"></script>
<script>
    const API_BASE = 'http://localhost:8080/api';
    let allQuizzes = [];
    let currentCategory = 'ALL';

    document.addEventListener('DOMContentLoaded', () => {
        // Wir laden die Quizzes erst, wenn die Seite bereit ist
        loadQuizzes();
    });

    async function loadQuizzes() {
        const container = document.getElementById('quizContainer');
        try {
            console.log("Fetching from:", `${API_BASE}/quizzes/published`);

            // fetch statt authFetch probieren, falls kein Token nötig ist
            const response = await fetch(`${API_BASE}/quizzes/published`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const result = await response.json();
                console.log("API Result:", result);

                // Mapping auf dein ApiResponse<Page<QuizDto>> Format
                if (result && result.data && result.data.content) {
                    allQuizzes = result.data.content;
                    updateStats();
                    displayQuizzes(allQuizzes);
                } else {
                    console.error("Format falsch oder keine Daten:", result);
                    allQuizzes = [];
                    displayQuizzes([]);
                }
            } else {
                throw new Error(`HTTP Error: ${response.status}`);
            }
        } catch (error) {
            console.error('Fetch error:', error);
            container.innerHTML = `
                <div style="text-align: center; padding: var(--space-12);">
                    <p style="color: var(--error);">
                        <b>Verbindung fehlgeschlagen.</b><br>
                        Prüfe ob das Backend läuft und der Pfad <br>
                        <i>/api/quizzes/published</i> in SecurityConfig freigegeben ist.
                    </p>
                    <button class="btn btn-primary" onclick="loadQuizzes()" style="margin-top:20px;">
                        Erneut versuchen
                    </button>
                </div>`;
        }
    }

    function updateStats() {
        if (!Array.isArray(allQuizzes)) return;
        const totalQuestions = allQuizzes.reduce((sum, quiz) => sum + (quiz.questionCount || 0), 0);
        const avgQuestions = allQuizzes.length > 0 ? Math.round(totalQuestions / allQuizzes.length) : 0;

        document.getElementById('totalQuizzes').textContent = allQuizzes.length;
        document.getElementById('totalQuestions').textContent = totalQuestions;
        document.getElementById('avgQuestions').textContent = avgQuestions;
    }

    function displayQuizzes(quizzes) {
        const container = document.getElementById('quizContainer');
        if (quizzes.length === 0) {
            container.innerHTML = '<p style="text-align:center;">Keine Quizzes gefunden.</p>';
            return;
        }

        container.innerHTML = `
            <div class="quiz-grid">
                ${quizzes.map(quiz => `
                    <div class="quiz-card" onclick="startQuiz(${quiz.id})">
                        <div class="quiz-category">${quiz.category || 'Allgemein'}</div>
                        <div class="quiz-title">${quiz.title}</div>
                        <div class="quiz-description">${quiz.description || ''}</div>
                        <div class="quiz-meta">
                            <span class="quiz-questions">${quiz.questionCount || 0} Fragen</span>
                            <button class="btn btn-sm btn-primary">Starten</button>
                        </div>
                    </div>
                `).join('')}
            </div>`;
    }

    function filterQuizzes() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allQuizzes.filter(quiz => {
            const matchesSearch = quiz.title.toLowerCase().includes(searchTerm);
            const matchesCat = currentCategory === 'ALL' || quiz.category === currentCategory;
            return matchesSearch && matchesCat;
        });
        displayQuizzes(filtered);
    }

    function filterCategory(event, cat) {
        currentCategory = cat;
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        filterQuizzes();
    }

    function startQuiz(id) {
        window.location.href = `/quiz/quiz.html?id=${id}`;
    }
</script>
</body>
</html>
